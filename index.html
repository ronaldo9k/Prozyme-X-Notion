<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- 💡 아래 3줄 코드를 꼭 추가해 주세요! -->
  <link rel="manifest" href="manifest.json?v=1">
  <link rel="icon" href="R9.png?v=1" type="image/png">
  <link rel="apple-touch-icon" href="R9.png?v=1">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#05070b">

  <title>푸로찜 에스 음성 입출고 시스템</title>


  <style>

    /* ========================================================================
       ⭐ 기본
       ======================================================================== */

    * {
      box-sizing: border-box;
    }


    :root {

      --bg: #05070b;

      --card: rgba(255,255,255,.96);

      --text: #111827;

      --muted: #6b7280;

      --line: #e5e7eb;

      --green: #15803d;

      --red: #dc2626;

      --dark: #111827;

      --gold: #c9a227;

    }


    /* ========================================================================
       ⭐ 전체 배경
       ======================================================================== */

    body {

      margin: 0;

      padding: 0 14px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      min-height: 100vh;

      position: relative;

      overflow-x: hidden;

      background:
        #05070b
        url("ronaldo-fenomeno.png")
        center top /
        cover
        fixed
        no-repeat;

    }


    /* ========================================================================
       ⭐ 전체 배경 어둡게 처리
       ======================================================================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -1;

      pointer-events: none;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.38) 0%,
          rgba(0,0,0,.55) 38%,
          rgba(0,0,0,.78) 100%
        );

    }


    /* ========================================================================
       ⭐ 황금빛 분위기
       ======================================================================== */

    body::after {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -1;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 8%,
          rgba(201,162,39,.20),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 45%,
          rgba(0,0,0,0),
          rgba(0,0,0,.35) 75%
        );

    }


    .container {

      max-width: 560px;

      margin: 0 auto;

      position: relative;

      z-index: 1;

    }


    /* ========================================================================
       ⭐ 화면 단계
       ======================================================================== */

    .screen {

      width: 100%;

    }


    #inputScreen {

      display: block;

    }


    #resultCard {

      display: block;

    }


    .step-hidden {

      display: none !important;

    }


    .step-indicator {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin: 4px 0 15px;

      font-size: 12px;

      font-weight: 800;

      color: #d1d5db;

      text-shadow:
        0 2px 5px rgba(0,0,0,.7);

    }


    .step-dot {

      width: 26px;

      height: 26px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(255,255,255,.22);

      color: #e5e7eb;

      font-size: 12px;

      font-weight: 900;

      border: 1px solid rgba(255,255,255,.18);

      backdrop-filter: blur(5px);

    }


    .step-dot.active {

      background: #c9a227;

      color: #111827;

      border-color: #e5c45b;

      box-shadow:
        0 0 14px rgba(201,162,39,.55);

    }


    .step-line {

      width: 35px;

      height: 2px;

      background: rgba(255,255,255,.25);

    }


    /* ========================================================================
       ⭐ HERO
       ======================================================================== */

    .hero {

      position: relative;

      margin: 0 -14px 18px;

      height: 285px;

      overflow: hidden;

      border-radius: 0 0 30px 30px;

      background:
        #05070b
        url("ronaldo-fenomeno.png")
        center 22% /
        cover
        no-repeat;

      box-shadow:
        0 14px 35px rgba(0,0,0,.45);

    }


    .hero-image {

      display: none;

    }


    .hero-overlay {

      position: absolute;

      inset: 0;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.05) 0%,
          rgba(0,0,0,.22) 30%,
          rgba(0,0,0,.88) 100%
        );

    }


    .hero-content {

      position: absolute;

      left: 22px;

      right: 22px;

      bottom: 18px;

      color: white;

      text-align: center;

      text-shadow:
        0 2px 8px rgba(0,0,0,.85),
        0 4px 18px rgba(0,0,0,.72);

    }


    .hero-kicker {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 1px;

      font-size: 1px;

      line-height: 1;

      margin-bottom: 7px;

      color: #fff;

      text-align: center;

      transform: none;

      text-shadow: 0 4px 12px rgba(0,0,0,.95);

    }


    .kicker-name {

      font-family: Georgia, "Times New Roman", serif;

      font-size: 12px;

      font-weight: 700;

      font-style: normal;

      letter-spacing: 4.5px;

      color: #f4e5ae;

      text-shadow:
        0 1px 0 rgba(255,255,255,.55),
        0 3px 8px rgba(0,0,0,.9);

    }


    .kicker-crown {

      display: block;

      margin: -1px 0 -1px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 17px;

      line-height: .9;

      color: #f1c84b;

      text-shadow:
        0 1px 0 #fff0a0,
        0 2px 5px rgba(0,0,0,.95),
        0 0 12px rgba(239,192,47,.5);

    }


    .kicker-fenomeno {

      display: block;

      font-family: "Brush Script MT", "Segoe Print", "Bradley Hand", cursive;

      font-size: 29px;

      line-height: .9;

      font-weight: 900;

      font-style: italic;

      letter-spacing: 1px;

      color: #f3ca55;

      transform: skewX(-7deg) rotate(-1deg);

      text-shadow:
        1px 1px 0 #fff0a5,
        2px 3px 0 #a9750c,
        3px 5px 0 #684500,
        0 8px 15px rgba(0,0,0,.95),
        0 0 18px rgba(244,190,40,.42);

      -webkit-text-stroke: .45px rgba(255,232,142,.68);

    }


    .hero-title {

      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;

      font-size: 32px;

      line-height: 1.04;

      font-weight: 900;

      margin: 0;

      letter-spacing: 1.8px;

      color: #ffffff;

      text-shadow:
        0 2px 0 rgba(0,0,0,.85),
        0 4px 10px rgba(0,0,0,.92),
        0 0 20px rgba(255,255,255,.12);

    }


    .hero-sub {

      margin-top: 9px;

      font-size: 13px;

      line-height: 1.35;

      font-weight: 800;

      letter-spacing: 1.8px;

      color: #fff;

      opacity: 1;

      text-shadow:
        0 1px 0 rgba(255,255,255,.3),
        0 3px 10px rgba(0,0,0,.95);

    }


    /* ========================================================================
       ⭐ CARD
       ======================================================================== */

    .card {

      background:
        rgba(255,255,255,.95);

      border-radius: 22px;

      padding: 19px;

      margin-bottom: 16px;

      box-shadow:
        0 10px 32px rgba(0,0,0,.30);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

    }


    /* ========================================================================
       ⭐ 버튼 기본
       ======================================================================== */

    button {

      width: 100%;

      border: 1.5px solid rgba(232,194,70,.95);

      border-radius: 19px;

      padding: 15px 18px;

      font-size: 18px;

      font-weight: 900;

      letter-spacing: .2px;

      cursor: pointer;

      margin-top: 9px;

      transition:
        transform .12s ease,
        opacity .12s ease,
        box-shadow .12s ease;

      position: relative;

      overflow: hidden;

      text-shadow: 0 2px 5px rgba(0,0,0,.75);

      box-shadow:
        0 5px 16px rgba(0,0,0,.45),
        0 0 13px rgba(226,185,52,.18),
        inset 0 1px 0 rgba(255,245,190,.2);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

    }


    /* ========================================================================
       ⭐ 첫 화면 3개 메인 버튼 영역
       ======================================================================== */

    #inputScreen > .card:first-of-type {

      background: transparent;

      box-shadow: none;

      backdrop-filter: none;

      -webkit-backdrop-filter: none;

      padding: 0 8px 2px;

    }


    /* ========================================================================
       ⭐⭐⭐ 최종 메인 버튼
       ======================================================================== */

    #inputScreen > .card:first-of-type button {

      width: 170px;

      min-width: 170px;

      max-width: 170px;

      height: 56px;

      min-height: 56px;

      margin: 9px auto 0;

      padding: 0 12px;

      display: flex;

      flex-direction: row;

      align-items: center;

      justify-content: center;

      gap: 18px;

      border-radius: 16px;

      border: 1.5px solid #e5b83c;

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98) 0%,
          rgba(28,23,12,.97) 50%,
          rgba(6,7,8,.99) 100%
        );

      color: #fff;

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 0;

      line-height: 1;

      text-align: center;

      white-space: nowrap;

      text-shadow:
        0 2px 5px rgba(0,0,0,.95);

      box-shadow:

        0 5px 13px rgba(0,0,0,.58),

        0 0 9px rgba(226,181,48,.27),

        inset 0 1px 0 rgba(255,245,190,.18),

        inset 0 -1px 0 rgba(0,0,0,.85);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

    }


    /* ========================================================================
       ⭐ 최종 버튼 아이콘
       ======================================================================== */

    .main-button-icon {

      flex: 0 0 auto;

      width: auto;

      height: auto;

      border: 0;

      border-radius: 0;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      background: transparent;

      box-shadow: none;

      color: #efbd3d;

      text-shadow:
        0 0 7px rgba(240,194,65,.75);

    }


    /* ========================================================================
       ⭐ SVG는 사용하지 않음
       ======================================================================== */

    .main-button-icon svg {

      display: none;

    }


    /* ========================================================================
       ⭐ 버튼 글자
       ======================================================================== */

    .main-button-label {

      flex: 0 0 auto;

      min-width: 0;

      text-align: center;

      white-space: nowrap;

      color: #ffffff;

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 0;

      line-height: 1;

      display: inline-block;

    }


    /* ========================================================================
       ⭐ 오른쪽 화살표 제거
       ======================================================================== */

    #inputScreen > .card:first-of-type button::after {

      content: none;

    }


    /* ========================================================================
       ⭐ 버튼 위 금색 하이라이트
       ======================================================================== */

    #inputScreen > .card:first-of-type button::before {

      content: "";

      position: absolute;

      left: 12px;

      right: 12px;

      top: 0;

      height: 1px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,239,160,.78),
          transparent
        );

      pointer-events: none;

    }


    /* ========================================================================
       ⭐ 버튼 눌림
       ======================================================================== */

    #inputScreen > .card:first-of-type button:active {

      transform:
        translateY(1px)
        scale(.985);

      box-shadow:

        0 2px 8px rgba(0,0,0,.65),

        0 0 19px rgba(226,185,52,.42),

        inset 0 2px 4px rgba(0,0,0,.48),

        inset 0 1px 0 rgba(255,245,190,.24);

    }


    /* ========================================================================
       ⭐ 버튼별 미세한 색감
       ======================================================================== */

    #startButton {

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98),
          rgba(43,34,14,.95),
          rgba(7,8,8,.99)
        );

    }


    #finishButton {

      background:

        linear-gradient(
          135deg,
          rgba(7,7,8,.98),
          rgba(42,27,16,.95),
          rgba(7,8,8,.99)
        );

    }


    #directButton {

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98),
          rgba(43,35,15,.95),
          rgba(7,8,8,.99)
        );

    }


    /* ========================================================================
       ⭐⭐⭐ 비활성 완료 버튼
       ======================================================================== */

    #inputScreen > .card:first-of-type button:disabled {

      opacity: .42;

      cursor: not-allowed;

      filter:
        grayscale(.72)
        saturate(.35)
        brightness(.68);

      border-color: rgba(150,150,150,.55);

      background:

        linear-gradient(
          135deg,
          rgba(45,45,45,.92),
          rgba(70,70,70,.88),
          rgba(35,35,35,.94)
        );

      box-shadow:

        0 3px 8px rgba(0,0,0,.58),

        0 0 3px rgba(180,180,180,.08),

        inset 0 1px 0 rgba(255,255,255,.08),

        inset 0 -2px 5px rgba(0,0,0,.75);

    }


/* ========================================================================
   ⭐ statusCard
   ⭐ 첫 화면 하단 상태 표시 영역
   ======================================================================== */

#statusCard {

  position: sticky;

  top: 8px;

  z-index: 100;

  width: 100%;

  min-height: 50px;

  margin-top: 8px;

  box-sizing: border-box;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 12px 20px;

  background:
    rgba(5, 7, 11, 0.72);

  border:
    1px solid rgba(255, 215, 0, 0.20);

  border-radius: 22px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.06);

  backdrop-filter: blur(10px);

  -webkit-backdrop-filter: blur(10px);

  color: #ffffff;

  text-align: center;

  line-height: 1.6;

}


/* ⭐ 상태 표시 안의 내용도 정확히 가운데 */

#statusCard #inputResult {

  width: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

}


/* ⭐ 버튼 비활성화 */

button:disabled {

  cursor: not-allowed;

}


    /* ========================================================================
       ⭐ 확인 화면 버튼
       ======================================================================== */

    #confirmButton {

      background: var(--green);

      color: white;

    }


    #retryButton {

      background: #64748b;

      color: white;

    }


    #result {

      line-height: 1.7;

      font-size: 17px;

    }


    .listening {

      color: var(--red);

      font-weight: 800;

    }


    .success {

      color: var(--green);

      font-weight: 900;

      font-size: 19px;

    }


    .error {

      color: var(--red);

      font-weight: 800;

    }


    /* ========================================================================
       ⭐ 상태
       ======================================================================== */

    .timer {

      text-align: center;

      font-size: 14px;

      color: #6b7280;

      margin-top: 9px;

    }


    .loading {

      text-align: center;

      padding: 10px 0;

      color: #555;

      font-weight: 700;

    }


    /* ========================================================================
       ⭐ 확인 화면
       ======================================================================== */

    .preview-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;

    }


    /* ========================================================================
       ⭐⭐⭐ STEP 2 상단 왼쪽 버튼 묶음
       *
       * 기존 "← 입력 화면" 버튼 옆에
       * 새 "🔄 새로 고침" 버튼을 붙이기 위한 최소 추가 영역입니다.
       * ======================================================================== */

    .preview-top {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 0;
    }

    .preview-actions {

      display: flex;

      align-items: center;

      gap: 6px;

      min-width: 0;

    }


    .preview-back {

      width: auto;

      margin: 0;

      padding: 8px 12px;

      border-radius: 10px;

      background: #f1f5f9;

      color: #475569;

      font-size: 13px;

      font-weight: 800;

    }


    /* ========================================================================
       ⭐⭐⭐ STEP 2 데이터 새로 고침 버튼
       *
       * 브라우저 전체 새로고침이 아닙니다.
       * 거래처 / 제품 / 납품형태 / 제2배송지 목록만
       * GAS에서 다시 받아옵니다.
       * ======================================================================== */

    .preview-refresh {

      width: auto;

      min-width: 0;

      margin: 0;

      padding: 8px 11px;

      border-radius: 10px;

      border: 1px solid #d7dbe1;

      background: #ffffff;

      color: #475569;

      font-size: 13px;

      font-weight: 800;

      line-height: 1.2;

      text-shadow: none;

      box-shadow:
        0 2px 6px rgba(0,0,0,.08);

      white-space: nowrap;

    }


    /* ========================================================================
       ⭐⭐⭐ STEP 2 푸로찜 총판 Home 열기 버튼
       *
       * "🔄 새로 고침" 옆에만 추가되는 작은 버튼입니다.
       * 기존 버튼 및 전체 button 기본 스타일은 건드리지 않습니다.
       * ======================================================================== */

    .preview-notion-home {

      width: auto;

      min-width: 0;

      margin: 0;

      padding: 8px 11px;

      border-radius: 10px;

      border: 1px solid #d7dbe1;

      background: #ffffff;

      color: #475569;

      font-size: 13px;

      font-weight: 800;

      line-height: 1.2;

      text-shadow: none;

      box-shadow:
        0 2px 6px rgba(0,0,0,.08);

      white-space: nowrap;

    }


    .preview-notion-home:hover {

      background: #f8fafc;

    }


    .preview-notion-home:active {

      transform:
        translateY(1px);

      box-shadow:
        0 1px 3px rgba(0,0,0,.10);

    }


    .preview-notion-home:focus {

      outline: none;

    }


    .preview-refresh:hover {

      background: #f8fafc;

    }


    .preview-refresh:active {

      transform:
        translateY(1px);

      box-shadow:
        0 1px 3px rgba(0,0,0,.10);

    }


    .preview-refresh:disabled {

      opacity: .58;

      cursor: wait;

    }


    .preview-step {

      font-size: 12px;

      font-weight: 900;

      color: #64748b;

      white-space: nowrap;

    }


    .preview-title {

      font-size: 22px;

      font-weight: 900;

      margin-bottom: 8px;

    }


    .preview-badge {

      display: inline-block;

      padding: 5px 9px;

      border-radius: 999px;

      background: #f3f4f6;

      color: #4b5563;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 18px;

    }


    .edit-row {

      margin-bottom: 16px;

    }


    .edit-label {

      display: block;

      color: #4b5563;

      font-size: 14px;

      font-weight: 800;

      margin-bottom: 7px;

    }


    .edit-input,
    .edit-select {

      width: 100%;

      padding: 14px;

      border: 1px solid #d7dbe1;

      border-radius: 12px;

      background: white;

      font-size: 17px;

      outline: none;

    }


    .edit-input:focus,
    .edit-select:focus {

      border-color: var(--green);

      box-shadow:
        0 0 0 3px rgba(21,128,61,.10);

    }


    .size-display {

      background: #f3f4f6;

      color: #555;

      cursor: not-allowed;

    }


    .help-text {

      margin-top: 5px;

      font-size: 12px;

      color: #777;

    }


    .original-text {

      background: #f3f4f6;

      padding: 14px;

      border-radius: 12px;

      margin-top: 18px;

      font-size: 15px;

      line-height: 1.6;

    }


    .button-group {

      margin-top: 19px;

    }


    /* ========================================================================
       ⭐ 거래처 검색 + 오른쪽 ▼ 선택
       ======================================================================== */

    .client-choice-row {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        150px;

      gap: 8px;

      align-items: stretch;

    }


    .client-search-wrap {

      position: relative;

      min-width: 0;

    }


    .client-search-input {

      padding-left: 43px;

    }


    .search-icon {

      position: absolute;

      left: 14px;

      top: 13px;

      font-size: 20px;

      z-index: 2;

      pointer-events: none;

    }


    #clientSelect {

      display: block;

      min-width: 0;

      cursor: pointer;

      padding-right: 10px;

    }


    .client-candidates {

      margin-top: 7px;

      border: 1px solid #e1e5ea;

      border-radius: 12px;

      overflow: hidden;

      background: white;

      max-height: 220px;

      overflow-y: auto;

    }


    .candidate-empty {

      padding: 13px;

      color: #777;

      font-size: 14px;

    }


    .candidate-item {

      width: 100%;

      text-align: left;

      border: 0;

      border-bottom: 1px solid #edf0f3;

      border-radius: 0;

      margin: 0;

      padding: 13px 14px;

      background: white;

      color: #111827;

      font-size: 16px;

      font-weight: 700;

    }

    /* ========================================================================
       ⭐⭐⭐ 2026-09 추가 (기존 스타일은 하나도 지우지 않고 아래만 더했습니다)
       ======================================================================== */

    /* ----------------------------------------------------------------------
       ① 첫 화면 하단 상태 문구 : FENOMENO RONALDO 9
          - 두껍게 / 황금색 / 빛나는 효과 / 더 큰 글씨 / 감각적인 글씨체
       ---------------------------------------------------------------------- */

    #statusCard #result .fenomeno-status {

      display: inline-block;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 24px;

      font-weight: 900;

      font-style: normal;

      letter-spacing: 2px;

      line-height: 1.3;

      color: #ffd76a;

      padding: 2px 6px;

      text-shadow:
        0 0 6px rgba(255,214,106,.85),
        0 0 18px rgba(255,196,40,.65),
        0 2px 4px rgba(0,0,0,.85);

      filter:
        drop-shadow(0 0 10px rgba(255,208,70,.55));

      animation:
        fenomenoGlow 2.4s ease-in-out infinite;

    }


    /* ⭐ 배경이 빛나듯 반짝이는 효과 */

    @keyframes fenomenoGlow {

      0%, 100% {

        filter:
          drop-shadow(0 0 8px rgba(255,208,70,.45));

      }

      50% {

        filter:
          drop-shadow(0 0 22px rgba(255,226,120,.95));

      }

    }


    /* ⭐ 황금 그라데이션 글씨 (지원하는 브라우저에서만) */

    @supports ((-webkit-background-clip: text) or (background-clip: text)) {

      #statusCard #result .fenomeno-status {

        background:
          linear-gradient(
            180deg,
            #fff6cf 0%,
            #ffd76a 35%,
            #c9a227 70%,
            #8a6a12 100%
          );

        -webkit-background-clip: text;

        background-clip: text;

        -webkit-text-fill-color: transparent;

        text-shadow: none;

      }

    }


    @media (max-width: 420px) {

      #statusCard #result .fenomeno-status {

        font-size: 21px;

        letter-spacing: 1.4px;

      }

    }


    /* ----------------------------------------------------------------------
       ② STEP 2 상단 "Notion 거래처 정보를 가져오는 중..." 상태바
       ---------------------------------------------------------------------- */

    .step2-status-bar {

      display: flex;

      align-items: center;

      gap: 10px;

      margin: 0 0 14px;

      /* ⭐⭐⭐ 신규 추가 : 오른쪽 "등록 가능 표시바"와 균등 폭(50%:50%) 배분을 위한 여백 */

      margin-right: 9px;

      padding: 12px 14px;

      border-radius: 12px;

      border: 1px solid rgba(201,162,39,.35);

      background:
        linear-gradient(
          135deg,
          rgba(5,7,11,.96) 0%,
          rgba(28,23,12,.94) 100%
        );

      color: #f3f4f6;

      font-size: 15px;

      font-weight: 800;

      line-height: 1.4;

      text-shadow: none;

      box-shadow:
        0 4px 14px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,245,190,.12);

    }


    .step2-status-bar .step2-status-text {

      flex: 1 1 auto;

      min-width: 0;

      text-align: left;

    }


    /* ⭐ 회전형 버퍼링 아이콘 (황금색) */

      flex: 0 0 auto;

      width: 20px;

      border: 3px solid rgba(255,215,0,.20);

    }

    .step2-status-bar.ready {

      border-color: rgba(21,128,61,.45);

      background:
        linear-gradient(

          rgba(5,11,7,.96) 0%,

        );

<script>


// ============================================================================
// ⭐ 1. GAS 주소
// ============================================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbz_148AxQRLFnr0Jol5U1dvgDjKgnD0pQkpNXn-o5wWbMdiLeOger_w_xLQOz7MlOom/exec";

// ============================================================================
// ⭐ 1-1. GAS 서버 일시 응답불가 상태 (신규 추가)
//
// - GAS는 가끔 깨어나는 데 시간이 걸려서 "Failed to fetch"가 납니다.
// - 요청이 연속으로 실패하면 60초 동안 요청을 보류했다가 다시 시도합니다.
// - 요청이 성공하면 바로 정상 상태로 돌아옵니다.
// ============================================================================

let GAS_DOWN_UNTIL = 0;


// ============================================================================
// 🏠 푸로찜 총판 Home - 고정 Notion 페이지
// ⭐ STEP 2의 "📖 노션 열기" 버튼에서만 사용합니다.
// ⭐ 새 Notion 페이지를 만들거나 현재 등록 페이지로 이동하지 않습니다.
// ============================================================================

const NOTION_HOME_URL =
  "https://app.notion.com/p/Home-2cbaf68cc87780f78e5fca7ea015cb96";


// ============================================================================
// ⭐ 2. 음성인식
// ============================================================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  document.getElementById("result").innerHTML =
    '<div class="error">' +
    '❌ 이 브라우저에서는 음성인식을 지원하지 않습니다.<br><br>' +
    '삼성 인터넷 또는 Chrome을 사용해주세요.' +
    '</div>';

}


// ============================================================================
// ⭐ 3. 상태 변수
// ============================================================================

let recognition = null;

let isRecording = false;

let finishRequested = false;

let recognitionRunning = false;

let finalTranscript = "";

let interimTranscript = "";

let displayedTranscript = "";

let recordingTimer = null;


/*
 * 🆕 모바일 음성인식 자동 재시작 타이머
 *
 * 모바일 브라우저에서는 continuous = true 상태에서도
 * 음성인식 엔진이 잠시 멈췄다고 판단하여 onend를 발생시키는 경우가 있습니다.
 *
 * 사용자가 "말하기 완료"를 누른 것이 아니라면
 * 짧게 기다린 뒤 자동으로 다시 recognition.start()를 실행합니다.
 *
 * ⭐ 기존 30초 제한과는 별개의 타이머입니다.
 * ⭐ 30초 recordingTimer는 그대로 유지합니다.
 */
let recognitionRestartTimer = null;


let isSending = false;

let pendingToken = null;

let clientList = [];

let productList = [];

let deliveryTypeList = [];

let secondDeliveryLocationList = [];

let currentInputMode = "voice";

// ⭐ 첫 화면에서 미리 선택한 입출고
let selectedTransactionMode = "출고";

/*
 * ⭐⭐⭐ 이번 문제 해결을 위한 최소 추가 변수
 *
 * 직접 입력을 누르는 순간 STEP 2를 먼저 보여주더라도
 * 초기 데이터가 아직 도착하지 않았다면,
 * 데이터 도착 후 현재 STEP 2를 한 번 다시 그릴 수 있도록
 * 현재 미리보기 데이터를 보관합니다.
 */
let currentPreviewData = null;

// ⭐ 앱 시작 시 Notion 초기 데이터 준비 상태
let initialDataReady = false;
let initialDataLoading = false;

// ⭐ 거래처만 저장하는 초경량 브라우저 캐시
const CLIENT_CACHE_KEY = "prozymeClientCacheV2";
const CLIENT_CACHE_MAX_AGE = 24 * 60 * 60 * 1000;



// ============================================================================
// ⭐ 4. DOM
// ============================================================================

const inputScreen =
  document.getElementById("inputScreen");


const resultCard =
  document.getElementById("resultCard");


const statusCard =
  document.getElementById("statusCard");


const startButton =
  document.getElementById("startButton");


const finishButton =
  document.getElementById("finishButton");


const directButton =
  document.getElementById("directButton");


const inboundModeButton =
  document.getElementById("inboundModeButton");


const outboundModeButton =
  document.getElementById("outboundModeButton");


const timer =
  document.getElementById("timer");


// ============================================================================
// ⭐ 버튼 표시 글자 변경
// ============================================================================

function setStartButtonLabel(
  label
) {

  const labelElement =
    startButton.querySelector(
      ".main-button-label"
    );


  if (labelElement) {

    labelElement.textContent =
      label;

  }

}


// ============================================================================
// ⭐ 화면 전환
// ============================================================================

function showInputScreen() {

  inputScreen.classList.remove("step-hidden");

  resultCard.classList.add("step-hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


function showResultScreen() {

  inputScreen.classList.add("step-hidden");

  resultCard.classList.remove("step-hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// ============================================================================
// ⭐ 화면 내부 결과 출력
// ============================================================================

const inputResult =
  document.querySelector("#statusCard #result");


const previewResult =
  document.querySelector("#resultCard #result");


// ============================================================================
// 🧹 5. 텍스트 정리
// ============================================================================

function cleanText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// ============================================================================
// 🧹 6. 중복 문장 방지
// ============================================================================

function appendWithoutDuplicate(
  current,
  addition
) {

  addition =
    cleanText(addition);

  if (!addition)
    return current;

  if (!current)
    return addition;

  if (current === addition)
    return current;

  if (current.includes(addition))
    return current;

  if (addition.includes(current))
    return addition;

  return current + " " + addition;

}


// ============================================================================
// 👀 7. 현재 음성 화면
// ============================================================================

function showCurrentText() {

  const finalText =
    cleanText(
      finalTranscript
    );


  const interimText =
    cleanText(
      interimTranscript
    );


  displayedTranscript =
    cleanText(
      finalText +
      (
        interimText
          ? " " + interimText
          : ""
      )
    );


  inputResult.innerHTML =

    '<div class="listening">' +
    '🎙️ 듣고 있어요...<br><br>' +
    '</div>' +

    escapeHtml(
      displayedTranscript ||
      "말씀해주세요."
    );

}


// ============================================================================
// 🎙️ 8. 음성인식 시작
// ============================================================================

function startRecognition() {

  if (
    !SpeechRecognition ||
    !recognition ||
    recognitionRunning
  ) {

    return;

  }


  /*
   * 🆕 이미 예약되어 있는 자동 재시작이 있다면
   * 지금 직접 시작하는 순간 기존 예약을 취소합니다.
   *
   * 이렇게 해야 "이어서 말하기"를 직접 눌렀을 때
   * 기존 자동 재시작과 겹치지 않습니다.
   */
  if (recognitionRestartTimer) {

    clearTimeout(
      recognitionRestartTimer
    );

    recognitionRestartTimer =
      null;

  }


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "recognition.start 오류:",
      error
    );

  }

}


// ============================================================================
// 🟢 9. 말하기 시작 / 이어서 말하기
// ============================================================================

startButton.addEventListener(
  "click",
  function() {

    if (isSending || !SpeechRecognition) return;

    /*
     * ⭐⭐⭐ 새 음성 구조
     *
     * 첫 화면에서는 Notion 거래처 데이터를 읽지 않습니다.
     *
     * 먼저 STEP 2를 열고, STEP 2에서 거래처 목록을 준비한 뒤
     * 거래처 + 수량만 약 5초간 받습니다.
     */
    startDirectInput(true);

  }
);


// ============================================================================
// 🛑 10. 말하기 완료
// ============================================================================

finishButton.addEventListener(
  "click",
  function() {

    finishRecording();

  }
);


// ============================================================================
// 📦 10-0. 입출고 사전 선택
// ============================================================================

function setTransactionMode(mode) {

  selectedTransactionMode =
    mode === "입고" ? "입고" : "출고";

  if (inboundModeButton) {
    inboundModeButton.classList.toggle(
      "selected",
      selectedTransactionMode === "입고"
    );
  }

  if (outboundModeButton) {
    outboundModeButton.classList.toggle(
      "selected",
      selectedTransactionMode === "출고"
    );
  }

}


if (inboundModeButton) {
  inboundModeButton.addEventListener(
    "click",
    function() {
      setTransactionMode("입고");
    }
  );
}


if (outboundModeButton) {
  outboundModeButton.addEventListener(
    "click",
    function() {
      setTransactionMode("출고");
    }
  );
}


// ============================================================================
// ✏️ 10-1. 직접 입력하기
// ============================================================================

directButton.addEventListener(
  "click",
  function() {

    startDirectInput();

  }
);


async function startDirectInput(autoStartVoice) {

  autoStartVoice = autoStartVoice === true;

  if (isSending)
    return;


  currentInputMode =
    "direct";

  pendingToken =
    null;


  if (isRecording) {

    finishRecording();

    return;

  }


  isSending =
    true;


  directButton.disabled =
    true;

  startButton.disabled =
    true;

  finishButton.disabled =
    true;


  /*
   * ⭐⭐⭐ 핵심 개선
   *
   * 직접 입력 화면은 기존처럼 즉시 표시합니다.
   *
   * 단, 초기 데이터가 아직 도착하지 않았을 수 있으므로
   * 현재 미리보기 데이터를 전역에 보관합니다.
   *
   * 초기 데이터가 도착하면 loadInitialData()에서
   * showPreview()를 한 번 다시 호출하여
   * 거래처 / 제품 / 납품형태 / 제2배송지 목록을 채웁니다.
   */


  const defaultProduct =
    getDefault15Product();


  const localPreview = {

    status:
      "preview",

    token:
      null,

    clientPageId:
      "",

    productPageId:
      defaultProduct
        ? defaultProduct.id
        : "",

    productName:
      defaultProduct
        ? defaultProduct.name
        : "",

    size:
      "15 KG",

    quantity:
      1,

    mode:
      selectedTransactionMode,

    deliveryDate:
      getTodayLocal(),

    deliveryType:
      "직송",

    secondDeliveryLocation:
      "",

    memo:
      "",
    
    text:
      "직접 입력"

  };


  /*
   * ⭐ 현재 직접 입력 미리보기 데이터를 보관
   *
   * 초기 데이터가 늦게 도착해도
   * 그때 이 데이터를 이용하여 화면을 다시 생성합니다.
   */

  currentPreviewData =
    localPreview;


  /*
   * ⭐ STEP 2를 서버 응답보다 먼저 표시
   */

  showPreview(
    localPreview
  );


  /*
   * ⭐⭐⭐ STEP 2에서만 거래처 목록을 준비합니다.
   *
   * 첫 화면에서는 절대로 거래처 DB를 호출하지 않습니다.
   * 캐시가 있으면 즉시 적용하고, 최신 목록은 백그라운드에서 갱신합니다.
   */
  loadClientDataForStep2();


  /*
   * ⭐ 실제 Notion 등록에 필요한 토큰을 받을 때까지
   * 확인 버튼만 잠시 비활성화
   */

  const confirmButton =
    document.getElementById(
      "confirmButton"
    );


  if (confirmButton) {

    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "⏳ 등록 준비 중...";

  }


  try {

    /*
     * ⭐ 기존 GAS directPreview 호출은 그대로 유지
     *
     * 화면을 이미 보여준 뒤
     * 백그라운드에서 실행됩니다.
     */

    const data =
      await postToGAS({
        action:
          "directPreview",
        mode:
          selectedTransactionMode
      });


    if (
      data.status !==
      "preview"
    ) {

      throw new Error(
        data.message ||
        "직접 입력 등록 준비에 실패했습니다."
      );

    }


    /*
     * ⭐ 기존과 동일하게
     * GAS에서 받은 pendingToken을 저장
     */

    pendingToken =
      data.token;


    /*
     * ⭐ GAS에서 받은 실제 데이터도
     * 현재 미리보기 데이터로 갱신
     */

    // ⭐ STEP 2 전용 데이터는 directPreview에서 한 번만 가져옵니다.
    productList =
      Array.isArray(data.products) ? data.products.slice() : [];

    deliveryTypeList =
      Array.isArray(data.deliveryTypes) ? data.deliveryTypes.slice() : [];

    secondDeliveryLocationList =
      Array.isArray(data.secondDeliveryLocations)
        ? data.secondDeliveryLocations.slice()
        : [];

    productList =
      sortProductsByRequestedOrder(productList);


    // ⭐ 서버 준비값을 기존 사용자가 입력한 client/quantity와 합칩니다.
    data.clientPageId =
      currentPreviewData && currentPreviewData.clientPageId
        ? currentPreviewData.clientPageId
        : data.clientPageId;

    data.clientName =
      currentPreviewData && currentPreviewData.clientName
        ? currentPreviewData.clientName
        : data.clientName;

    data.quantity =
      currentPreviewData && currentPreviewData.quantity
        ? currentPreviewData.quantity
        : data.quantity;

    data.mode =
      currentPreviewData && currentPreviewData.mode
        ? currentPreviewData.mode
        : data.mode;

    data.memo =
      currentPreviewData && typeof currentPreviewData.memo !== "undefined"
        ? currentPreviewData.memo
        : (data.memo || "");

    currentPreviewData =
      data;


    /*
     * ⭐ 혹시 초기 데이터 로딩보다
     * directPreview가 먼저 끝난 경우를 대비
     *
     * 현재 목록이 아직 비어 있으면
     * 초기 데이터 도착 후 자동으로 다시 그려집니다.
     *
     * 초기 데이터가 이미 준비되어 있으면
     * 여기서 실제 GAS 결과를 바로 적용합니다.
     */

    showPreview(
      data
    );


    if (autoStartVoice) {
      if (clientList.length > 0) {
        setTimeout(function() {
          const voiceButton =
            document.getElementById("clientVoiceButton");
          if (voiceButton) voiceButton.click();
        }, 80);
      } else {
        data._autoStartVoice = true;
        currentPreviewData = data;
      }
    }


    /*
     * ⭐ 혹시 초기 데이터 로딩보다
     * directPreview가 먼저 끝난 경우를 대비하여
     * 실제 GAS 결과를 화면의 제품 선택값에 반영
     */

    const productSelect =
      document.getElementById(
        "productSelect"
      );


    const sizeInput =
      document.getElementById(
        "sizeInput"
      );


    if (
      productSelect &&
      data.productPageId
    ) {

      productSelect.value =
        data.productPageId;

    }


    if (
      sizeInput &&
      data.size
    ) {

      sizeInput.value =
        data.size;

    }


    /*
     * ⭐ 이제 실제 등록이 가능하므로
     * 확인 버튼 활성화
     */

    const readyConfirmButton =
      document.getElementById(
        "confirmButton"
      );


    if (readyConfirmButton) {

      readyConfirmButton.disabled =
        false;

      readyConfirmButton.textContent =
        "✅ 수정된 내용으로 Notion 등록";

      // ⭐⭐⭐ 신규 추가 : 등록 준비 완료 → 오른쪽 표시바도 "등록 가능"으로

      setStep2ReadyBar(
        "ready",
        "✅ 노션 등록 가능"
      );

    }


  } catch (error) {

    console.error(
      error
    );


    /*
     * ⭐ STEP 2 화면은 그대로 유지
     */

    const failedConfirmButton =
      document.getElementById(
        "confirmButton"
      );


    if (failedConfirmButton) {

      failedConfirmButton.disabled =
        true;

      failedConfirmButton.textContent =
        "⚠️ 등록 준비 실패";

      // ⭐⭐⭐ 신규 추가 : 등록 준비 실패 → 오른쪽 표시바도 "등록 불가"로

      setStep2ReadyBar(
        "fail",
        "❌ 노션 등록 불가"
      );

    }


    const existingError =
      document.getElementById(
        "directPreviewError"
      );


    if (!existingError) {

      const errorBox =
        document.createElement(
          "div"
        );


      errorBox.id =
        "directPreviewError";


      errorBox.className =
        "error";


      errorBox.style.marginTop =
        "10px";


      errorBox.innerHTML =
        '❌ 직접 입력 등록 준비에 실패했어요.<br><br>' +
        escapeHtml(
          error.message ||
          String(error)
        );


      if (
        failedConfirmButton &&
        failedConfirmButton.parentElement
      ) {

        failedConfirmButton.parentElement.insertBefore(
          errorBox,
          failedConfirmButton
        );

      } else {

        previewResult.appendChild(
          errorBox
        );

      }

    }

  } finally {

    isSending =
      false;

    directButton.disabled =
      false;

  }

}

function getKoreanQuantityLocal(text) {

  const raw = String(text || "").replace(/\s+/g, "");

  const digit = raw.match(/(\d+)\s*(박스|box|개|통|팩)?/i);

  if (digit) {
    const n = Number(digit[1]);
    if (Number.isInteger(n) && n > 0) return n;
  }

  const map = {
    "한":1,"하나":1,"두":2,"둘":2,"세":3,"셋":3,"네":4,"넷":4,
    "다섯":5,"여섯":6,"일곱":7,"여덟":8,"아홉":9,"열":10
  };

  const m = raw.match(/(하나|한|두|둘|세|셋|네|넷|다섯|여섯|일곱|여덟|아홉|열)(?:박스|개|통|팩)?/);

  return m && map[m[1]] ? map[m[1]] : 1;
}


function findClientLocalFromVoice(text) {

  const normalized = String(text || "")
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace(/[.,!?]/g, "");

  const exact = clientList.filter(function(client) {
    const name = String(client.name || "")
      .toLowerCase()
      .replace(/\s+/g, "");
    return name && normalized.includes(name);
  });

  if (exact.length === 1) return exact[0];
  if (exact.length > 1) return null;

  /*
   * ⭐⭐⭐ 2026-09 추가 : 앞글자 2개 이상이 같으면 그 거래처를 찾습니다.
   *
   * 예) 거래처명이 "미노유통" 인데 "미노" 라고 말해도 선택
   * 예) 거래처명이 "미노유통" 인데 "미노식품" 이라고 말해도 선택
   * 예) 거래처명이 "별미 FND" 인데 "별미" 라고 말해도 선택
   */
  const prefixMatches = [];

  clientList.forEach(function(client) {

    const name = String(client.name || "")
      .toLowerCase()
      .replace(/\s+/g, "");

    if (name.length < 2 || !normalized) return;

    const maxLength =
      Math.min(name.length, 6);

    for (let length = maxLength; length >= 2; length--) {

      const prefix = name.substring(0, length);

      if (normalized.includes(prefix)) {

        prefixMatches.push({
          client: client,
          matched: length
        });

        break;

      }

    }

  });

  if (prefixMatches.length > 0) {

    prefixMatches.sort(function(a, b) {

      if (b.matched !== a.matched) return b.matched - a.matched;

      return String(a.client.name || "").length -
        String(b.client.name || "").length;

    });

    return prefixMatches[0].client;

  }


  // ⭐ 짧은 음성에서도 작은 오인식을 견디기 위한 간단한 편집거리 검색
  function distance(a,b) {
    const dp = Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
    for(let i=0;i<=a.length;i++) dp[i][0]=i;
    for(let j=0;j<=b.length;j++) dp[0][j]=j;
    for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) {
      dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    }
    return dp[a.length][b.length];
  }

  const candidates=[];
  clientList.forEach(function(client){
    const name=String(client.name||"").toLowerCase().replace(/\s+/g,"");
    if(name.length<3 || !normalized) return;
    const allowed=name.length>=6?2:1;
    let best=999;
    const min=Math.max(1,name.length-allowed);
    const max=Math.min(normalized.length,name.length+allowed);
    for(let len=min;len<=max;len++){
      for(let i=0;i+len<=normalized.length;i++){
        best=Math.min(best,distance(name,normalized.substring(i,i+len)));
      }
    }
    if(best<=allowed){
      candidates.push({client:client,score:Math.round((1-best/name.length)*100)});
    }
  });

  candidates.sort((a,b)=>b.score-a.score);
  if(!candidates.length || candidates[0].score<75) return null;
  if(candidates[1] && candidates[0].score-candidates[1].score<8) return null;
  return candidates[0].client;
}


function applyQuickVoiceToPreview(text) {

  const client = findClientLocalFromVoice(text);

  if (!client) {

      '❌ 거래처를 정확하게 찾지 못했어요.<br><br>' +
      '예: 홍길동상사 / 홍길동상사 열두 개' +
      '</div>';
    return false;
  }

  const defaultProduct = getDefault15Product();
  if (!defaultProduct) {
    inputResult.innerHTML = "📦 제품 정보를 준비하는 중입니다.";
    return false;
  }

  currentInputMode = "voice";

  const localPreview = {
    status:"preview",

    clientName:client.name,
    productPageId:defaultProduct.id,
    productName:defaultProduct.name,

    mode:selectedTransactionMode,
    deliveryDate:getTodayLocal(),

    secondDeliveryLocation:"",
    memo:"",
    text:text
  };

  currentPreviewData = localPreview;
  showPreview(localPreview);
  return true;
}


async function finishQuickVoiceRecording() {

  if (!isRecording) return;

  isRecording=false;
  finishRequested=true;
  clearTimeout(recordingTimer);
  recognitionRunning=false;

  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }

  startButton.disabled=false;
  setStartButtonLabel("말하기 시작");
  finishButton.disabled=true;
  directButton.disabled=false;
  timer.textContent="";

  const text=cleanText(finalTranscript || displayedTranscript);
  if(!text){
    inputResult.innerHTML='<div class="error">❌ 음성 내용을 듣지 못했어요.<br><br>다시 말해주세요.</div>';
    return;
  }

  const opened=applyQuickVoiceToPreview(text);
  if(!opened) return;

  // ⭐ STEP 2는 즉시 보여주고, 등록용 토큰/제품/옵션만 백그라운드에서 준비합니다.
  isSending=true;
  try {
    const data=await postToGAS({action:"directPreview",mode:selectedTransactionMode});
    if(data.status!=="preview") throw new Error(data.message||"등록 준비에 실패했습니다.");

    productList=Array.isArray(data.products)?data.products.slice():[];
    deliveryTypeList=Array.isArray(data.deliveryTypes)?data.deliveryTypes.slice():[];
    secondDeliveryLocationList=Array.isArray(data.secondDeliveryLocations)?data.secondDeliveryLocations.slice():[];
    productList=sortProductsByRequestedOrder(productList);

    const local=currentPreviewData||{};
    data.clientPageId=local.clientPageId||data.clientPageId||"";
    data.clientName=local.clientName||data.clientName||"";
    data.quantity=local.quantity||data.quantity||1;
    data.mode=local.mode||data.mode||selectedTransactionMode;
    data.text=local.text||text;
    data.memo=local.memo||"";
    currentPreviewData=data;
    pendingToken=data.token;
    showPreview(data);
  } catch(error) {
    const button=document.getElementById("confirmButton");
    if(button){button.disabled=true;button.textContent="⚠️ 등록 준비 실패";}

    // ⭐⭐⭐ 신규 추가 : 등록 준비 실패 → 오른쪽 표시바도 "등록 불가"로

    setStep2ReadyBar("fail", "❌ 노션 등록 불가");
    const box=document.createElement("div");
    box.className="error";
    box.style.marginTop="10px";
    box.innerHTML='❌ 등록 준비에 실패했어요.<br><br>'+escapeHtml(error.message||String(error));
    previewResult.appendChild(box);
  } finally {
    isSending=false;
  }
}

  /*

  recognitionRunning =

  startButton.disabled =

  setStartButtonLabel(

  finishButton.disabled =

  directButton.disabled =

// 📡 13. GAS POST 공통
// ============================================================================

async function postToGAS(payload) {

  /*
   * ⭐⭐⭐ 신규 추가 ① : GAS가 잠시 응답하지 않는 동안(자는 중) 무의미한 재시도를 막습니다.
   *
   * - 요청이 연속 3번 "Failed to fetch"로 실패하면 60초 동안 쉬었다가 다시 시도합니다.
   * - 60초가 지나면 자동으로 다시 정상 시도합니다.
   * - 요청이 한 번이라도 성공하면 쿨다운은 즉시 풀립니다.
   */
  if (
    GAS_DOWN_UNTIL > 0 &&
    Date.now() < GAS_DOWN_UNTIL
  ) {
    throw new Error(
      "GAS 서버가 잠시 응답하지 않아요. 1분 뒤 자동으로 다시 시도돼요. (잠시 후 다시 눌러주세요.)"
    );
  }


  /*
   * ⭐⭐⭐ 신규 추가 ② : 한 번만 보내지 말고, 최대 3번까지 자동으로 다시 보냅니다.
   *
   * - GAS는 가끔 첫 연결을 잠깐 못 받아줍니다(서버가 자다가 깨어나는 콜드 스타트).
   * - 1번 실패했다고 바로 에러를 보여주지 않고, 2초 → 4초 기다렸다가 다시 시도하면
   *   대부분 성공합니다. (기존 fetch 방식/헤더/응답처리는 그대로 유지합니다.)
   * - 노션 등록 요청(action === "confirm")을 두 번 눌러도 같은 기록이 두 번 생기지 않게
   *   GAS 서버 안의 안전장치(멱등성 처리)와 짝을 이룹니다.
   */

  const maxAttempts = 3;
  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {

    try {

      const response =
        await fetch(
          GAS_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload)

          }
        );


      const raw =
        await response.text();


      console.log(
        "GAS 응답:",
        raw
      );


      let data;


      try {

        data =
          JSON.parse(raw);

      } catch (jsonError) {

        throw new Error(
          "GAS 응답을 읽지 못했습니다.\n\n" +
          raw
        );

      }


      GAS_DOWN_UNTIL = 0;

      return data;

    } catch (error) {

      lastError = error;

      console.warn(
        "GAS 요청 " + attempt + "번째 시도 실패:",
        error
      );

      /*
       * 마지막 시도까지 실패했으면 쿨다운을 켜고 에러를 던집니다.
       * 아직 시도 횟수가 남아 있으면 잠시 기다렸다가 다시 시도합니다.
       */
      if (attempt >= maxAttempts) {

        GAS_DOWN_UNTIL =
          Date.now() + 60000;

        throw lastError;

      }

      await new Promise(function(resolve) {
        setTimeout(resolve, attempt * 2000);
      });

    }

  }

  throw lastError;

}

async function sendAnalyzeToGAS(text) {

  try {

    const data =
      await postToGAS({
        action: "analyze",
        text: text,
        mode: selectedTransactionMode
      });


    if (
      data.status !== "preview"
    ) {

      throw new Error(
        data.message ||
        "음성 분석에 실패했습니다."
      );

    }


    pendingToken =
      data.token;


    currentPreviewData =
      data;


    showPreview(data);


  } catch (error) {

    console.error(error);


    inputResult.innerHTML =

      '<div class="error">' +
      '❌ 분석하지 못했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button id="analyzeRetryButton" ' +
      'style="background:#64748b;color:white;">' +
      '❌ 다시 말하기' +
      '</button>' +

      '</div>';


    document
      .getElementById(
        "analyzeRetryButton"
      )
      .addEventListener(
        "click",
        resetForNewRecording
      );


  } finally {

    isSending =
      false;

  }

}

function readClientCache() {

  try {
    const raw = localStorage.getItem(CLIENT_CACHE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.clients)) return null;
    if (Date.now() - Number(saved.savedAt || 0) > CLIENT_CACHE_MAX_AGE) return null;
    return saved.clients;
  } catch (error) {
    return null;
  }
}


function writeClientCache(clients) {

  try {
    localStorage.setItem(
      CLIENT_CACHE_KEY,
      JSON.stringify({savedAt:Date.now(),clients:clients})
    );
  } catch (error) {
    console.log("거래처 캐시 저장 생략:", error);
  }
}


function applyClientList(clients) {

  clientList = Array.isArray(clients) ? clients.slice() : [];
  clientList.sort(function(a,b){
    return String(a.name||"").localeCompare(String(b.name||""),"ko");
  });

  if (clientList.length > 0) {
    initialDataReady = true;
  }
}

// 📋 15-1. 제품 표시 순서
// ============================================================================

function sortProductsByRequestedOrder(
  products
) {

  const order = {

    "15 KG": 0,

    "20 KG": 1,

    "12 KG": 2

  };


  return products
    .slice()
    .sort(
      function(a, b) {

        const aSize =
          getProductSize(
            a.name
          );


        const bSize =
          getProductSize(
            b.name
          );


        const ai =
          Object.prototype
            .hasOwnProperty
            .call(
              order,
              aSize
            )
              ? order[aSize]
              : 99;


        const bi =
          Object.prototype
            .hasOwnProperty
            .call(
              order,
              bSize
            )
              ? order[bSize]
              : 99;


        if (
          ai !== bi
        ) {

          return ai - bi;

        }


        return String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          ),
          "ko"
        );

      }
    );

}


// ============================================================================
// 📏 15-2. 제품명에서 규격 찾기
// ============================================================================

function getProductSize(
  productName
) {

  const text =
    String(
      productName || ""
    );


  if (
    /12\s*KG/i.test(text)
  )
    return "12 KG";


  if (
    /15\s*KG/i.test(text)
  )
    return "15 KG";


  if (
    /20\s*KG/i.test(text)
  )
    return "20 KG";


  return "";

}


// ============================================================================
// 🚚 15-3. 납품형태 정규화
// ⭐⭐⭐ 기존 코드 그대로 유지
// ============================================================================

function normalizeDeliveryType(
  value,
  options
) {

  const list =
    Array.isArray(options)
      ? options
      : [];


  const raw =
    cleanText(value);


  const exact =
    list.find(
      function(option) {

        return cleanText(option) === raw;

      }
    );


  if (exact) {

    return exact;

  }


  const compact =
    raw
      .toLowerCase()
      .replace(/\s+/g, "");


  const isParcel =
    compact.includes("택배") ||
    compact.includes("택배발송") ||
    compact.includes("택배송");


  if (isParcel) {

    const parcelOption =
      list.find(
        function(option) {

          const optionCompact =
            cleanText(option)
              .toLowerCase()
              .replace(/\s+/g, "");


          return optionCompact.includes(
            "택배"
          );

        }
      );


    if (parcelOption) {

      return parcelOption;

    }

  }


  const directOption =
    list.find(
      function(option) {

        const optionCompact =
          cleanText(option)
            .toLowerCase()
            .replace(/\s+/g, "");


        return optionCompact === "직송";

      }
    );


  if (directOption) {

    return directOption;

  }


  return "직송";

}


// ============================================================================
// 🚚 15-4. 납품형태 Select 옵션 생성
// ⭐⭐⭐ 기존 코드 그대로 유지
// ============================================================================

function buildDeliveryTypeOptions(
  selectedDeliveryType
) {

  const selected =
    normalizeDeliveryType(
      selectedDeliveryType,
      deliveryTypeList
    );


  const options =
    Array.isArray(deliveryTypeList) &&
    deliveryTypeList.length > 0
      ? deliveryTypeList
      : ["직송"];


  return options
    .map(
      function(option) {

        const isSelected =
          cleanText(option) ===
          cleanText(selected);


        return (

          '<option value="' +
            escapeAttribute(
              option
            ) +
          '"' +

          (
            isSelected
              ? " selected"
              : ""
          ) +

          '>' +

          escapeHtml(
            option
          ) +

          '</option>'

        );

      }
    )
    .join("");

}

function renderTransactionSummary() {

  const summary =
    document.getElementById("transactionSummary");

  const addressBox =
    document.getElementById("clientAddressSummary");

  const clientSelect =
    document.getElementById("clientSelect");

  const productSelect =
    document.getElementById("productSelect");

  const quantityInput =
    document.getElementById("quantityInput");

  const modeSelect =
    document.getElementById("modeSelect");

  const sizeInput =
    document.getElementById("sizeInput");

  if (!summary || !clientSelect || !productSelect || !quantityInput || !modeSelect || !sizeInput) {
    return;
  }

  const mode = modeSelect.value || selectedTransactionMode || "출고";
  const client = clientList.find(function(item) {
    return String(item.id) === String(clientSelect.value || "");
  });

  const quantity = Number(quantityInput.value || 0);
  const sizeMatch = String(sizeInput.value || "").match(/(12|15|20)\s*KG/i);
  const kg = sizeMatch ? Number(sizeMatch[1]) : 0;
  const totalWeight = kg * quantity;

  if (mode === "입고") {
    if (addressBox) addressBox.innerHTML = "";
    summary.innerHTML =
      '<span>총 무게: ' + totalWeight.toLocaleString("ko-KR") + ' KG</span>';
    return;
  }

  if (addressBox) {
    const address = client ? String(client.address || "").trim() : "";
    if (address) {
      addressBox.innerHTML =
        '<div class="client-address-line">' +
          '<span>주소: ' + escapeHtml(address) + '</span>' +
          '<button type="button" class="tmap-button" id="tmapButton">TMAP</button>' +
        '</div>';

      const tmapButton = document.getElementById("tmapButton");
      if (tmapButton) {
        tmapButton.addEventListener("click", function() {
          const url =
            "tmap://search?name=" +
            encodeURIComponent(address);
          window.location.href = url;
        });
      }
    } else {
      addressBox.innerHTML = "";
    }
  }

  const unitPrice = client ? Number(client.unitPrice || 0) : 0;
  const salesAmount = unitPrice * quantity;

  summary.innerHTML =
    '<span>단가: ' + unitPrice.toLocaleString("ko-KR") + '원</span>' +
    '<span>판매금: ' + salesAmount.toLocaleString("ko-KR") + '원</span>' +
    '<span>총 무게: ' + totalWeight.toLocaleString("ko-KR") + ' KG</span>';

}

function setupClientVoiceButton() {

  const button=document.getElementById("clientVoiceButton");
  if(!button || !SpeechRecognition) return;

  let localRecognition=null;
  let running=false;
  let timerId=null;
  let transcript="";

  function finish(){
    if(!running) return;
    running=false;
    clearTimeout(timerId);
    button.classList.remove("listening");
    button.textContent="🎙️";
    if(localRecognition){try{localRecognition.stop();}catch(e){}}
    const text=cleanText(transcript);
    if(!text) return;
    const client=findClientLocalFromVoice(text);
    if(!client){
      alert("거래처를 정확하게 찾지 못했어요. 다시 말씀해주세요.");
      return;
    }
    const qty=getKoreanQuantityLocal(text);
    const quantityInput=document.getElementById("quantityInput");
    const spokenQuantity = /\d+|하나|한|두|둘|세|셋|네|넷|다섯|여섯|일곱|여덟|아홉|열/.test(text.replace(/\s+/g,""));
    const finalQuantity = spokenQuantity
      ? qty
      : Number(quantityInput && quantityInput.value ? quantityInput.value : 1);
    const clientSelect=document.getElementById("clientSelect");
    const searchInput=document.getElementById("clientSearchInput");
    const pickerButton=document.getElementById("clientPickerButton");
    if(clientSelect) clientSelect.value=client.id;
    if(searchInput) searchInput.value=client.name;
    setSelectedClientDisplay(client);
    if(pickerButton) pickerButton.textContent="🏢 "+client.name;
    if(quantityInput) quantityInput.value=finalQuantity;
    if(currentPreviewData){currentPreviewData.clientPageId=client.id;currentPreviewData.clientName=client.name;currentPreviewData.quantity=finalQuantity;}
    renderTransactionSummary();
  }

  button.addEventListener("click",function(){
    if(running) { finish(); return; }
    transcript="";
    localRecognition=new SpeechRecognition();
    localRecognition.lang="ko-KR";
    localRecognition.continuous=false;
    localRecognition.interimResults=true;
    localRecognition.maxAlternatives=1;
    running=true;
    button.classList.add("listening");
    button.textContent="⏹️";
    localRecognition.onresult=function(event){
      let t="";
      for(let i=event.resultIndex;i<event.results.length;i++) t += " "+event.results[i][0].transcript;
      transcript=cleanText(t);
    };
    localRecognition.onerror=function(){finish();};
    localRecognition.onend=function(){if(running) finish();};
    try{localRecognition.start();}catch(e){finish();}
    timerId=setTimeout(finish,5000);
  });
}


function setupClientSearch(
  initialClientId
) {

  const input =
    document.getElementById(
      "clientSearchInput"
    );


  const candidates =
    document.getElementById(
      "clientCandidates"
    );


  const selectedBox =
    document.getElementById(
      "selectedClient"
    );


  const clientSelect =
    document.getElementById(
      "clientSelect"
    );


  if (
    !input ||
    !candidates ||
    !selectedBox ||
    !clientSelect
  ) {

    return;

  }


  // ⭐ 거래처 검색 버튼: 아래로 검색 패널 열기 / 닫기
  const searchPanel =
    document.getElementById(
      "clientSearchPanel"
    );

  const searchToggleButton =
    document.getElementById(
      "clientSearchToggleButton"
    );

  if (searchToggleButton && searchPanel) {

    searchToggleButton.addEventListener(
      "click",
      function() {

        searchPanel.classList.toggle(
          "step-hidden"
        );

        if (
          !searchPanel.classList.contains(
            "step-hidden"
          )
        ) {

          renderCandidates();

            document
    .getElementById(
      "clientSearchInput"
    )
    .focus();

        }

      }
    );

  }


  function normalizeSearchText(
    value
  ) {

    return String(
      value || ""
    )
      .toLowerCase()
      .replace(
        /\s+/g,
        ""
      )
      .trim();

  }


  function selectClient(
    client
  ) {

    clientSelect.value =
      client.id;


    input.value =
      client.name;


    setSelectedClientDisplay(client);

    const pickerButton =
      document.getElementById("clientPickerButton");

    if (pickerButton) {
      pickerButton.textContent =
        "🏢 " + client.name;
    }

    if (currentPreviewData) {
      currentPreviewData.clientPageId = client.id;
      currentPreviewData.clientName = client.name;
    }

    renderTransactionSummary();


    candidates.innerHTML =
      "";


    if (searchPanel) {

      searchPanel.classList.add(
        "step-hidden"
      );

    }

  }


  function bindCandidateButtons() {

    candidates
      .querySelectorAll(
        ".candidate-item"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              const client =
                clientList.find(
                  function(item) {

                    return String(
                      item.id
                    ) ===
                    String(
                      button.getAttribute(
                        "data-client-id"
                      )
                    );

                  }
                );


              if (client) {

                selectClient(
                  client
                );

              }

            }
          );

        }
      );

  }


  function renderCandidates() {

    const keyword =
      normalizeSearchText(
        input.value
      );


    if (!keyword) {

      const allListHtml =
        clientList
          .map(
            function(client) {

              return (

                '<button ' +
                'type="button" ' +
                'class="candidate-item" ' +
                'data-client-id="' +
                escapeAttribute(
                  client.id
                ) +
                '">' +

                '🏢 ' +

                escapeHtml(
                  client.name
                ) +

                '</button>'

              );

            }
          )
          .join("");

      candidates.innerHTML =
        allListHtml;

      bindCandidateButtons();

      return;

    }


    const matches =
      clientList.filter(
        function(client) {

          return normalizeSearchText(
            client.name
          ).includes(
            keyword
          );

        }
      );


    if (
      matches.length === 0
    ) {

      candidates.innerHTML =
        '<div class="candidate-empty">' +
        '찾는 거래처가 없습니다. 다른 검색어를 입력해보세요.' +
        '</div>';

      return;

    }


    candidates.innerHTML =
      matches
        .map(
          function(client) {

            return (

              '<button ' +
              'type="button" ' +
              'class="candidate-item" ' +
              'data-client-id="' +
              escapeAttribute(
                client.id
              ) +
              '">' +

              '🏢 ' +

              escapeHtml(
                client.name
              ) +

              '</button>'

            );

          }
        )
        .join("");


    bindCandidateButtons();

  }


  input.addEventListener(
    "input",
    function() {

      clientSelect.value =
        "";


      setSelectedClientDisplay(null);


      renderCandidates();

    }
  );


  input.addEventListener(
    "focus",
    function() {

      if (input.value) {

        renderCandidates();

      }

    }
  );


  clientSelect.addEventListener(
    "change",
    function() {

      const selectedId =
        clientSelect.value;


      if (!selectedId) {

        setSelectedClientDisplay(null);

        return;

      }


      const client =
        clientList.find(
          function(item) {

            return String(
              item.id
            ) ===
            String(
              selectedId
            );

          }
        );


      if (client) {

        selectClient(
          client
        );

      }

    }
  );


  if (initialClientId) {

    const initialClient =
      clientList.find(
        function(item) {

          return String(
            item.id
          ) ===
          String(
            initialClientId
          );

        }
      );


    if (initialClient) {

      selectClient(
        initialClient
      );

    }

  } else {

    renderCandidates();

  }

}

function getTodayLocal() {

  const now =
    new Date();


  const y =
    now.getFullYear();


  const m =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const d =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}

    );

    clientSelect.focus();

  }


  if (!productPageId) {

    alert(

    );

  }


  if (

    );


    previewResult.innerHTML =

      ) +

// 🛡️ 19. HTML 안전 처리
// ============================================================================

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}

// ⭐ ① 선택된 거래처 줄 표시 / 숨김 (오른쪽 X 버튼 포함)
function setSelectedClientDisplay(client) {

  const selectedBox =
    document.getElementById("selectedClient");

  if (!selectedBox) return;


  const textBox =
    document.getElementById("selectedClientText");


  if (!client) {

    selectedBox.style.display = "none";

  selectedBox.style.display = "flex";


  if (textBox) {

    textBox.innerHTML =
      "✅ 선택된 거래처: " +
      escapeHtml(client.name);

    return;

  }


  selectedBox.innerHTML =
    '<span id="selectedClientText" class="selected-client-text">' +
    "✅ 선택된 거래처: " +
    escapeHtml(client.name) +
    '</span>' +
    '<button type="button" id="selectedClientClearButton" ' +
    'class="selected-client-clear" ' +
    'title="선택된 거래처 지우기" ' +
    'onclick="clearSelectedClient()">✕</button>';

// ⭐ ③ STEP 2 상단 준비 상태바 (가져오는 중 / 입력 가능 / 실패)
//
// ⭐⭐⭐ 신규 추가 : readyState 파라미터 (기존 2개 인자 호출은 그대로 작동합니다)
//
// 왼쪽 검은 상태바의 상태가 바뀔 때, 오른쪽 "등록 가능 표시바"도
// 같은 상태로 함께 바뀌도록 합니다. 기존 호출 방식(state, message)은
// 그대로 작동하므로 다른 코드는 전혀 수정할 필요가 없습니다.
//
function setStep2StatusBar(state, message, readyState) {

  const bar =
    document.getElementById("step2StatusBar");

  if (!bar) return;


  const text =
    bar.querySelector(".step2-status-text");

  if (text && typeof message === "string") {

    text.textContent = message;

  }


  bar.classList.toggle("ready", state === "ready");

  bar.classList.toggle("error", state === "error");


  // ⭐⭐⭐ 신규 추가 : 오른쪽 "등록 가능 표시바"를 왼쪽 상태바와 같은 상태로 맞춥니다.
  //
  // - readyState를 직접 받았으면 그 값을 사용하고 (3번째 인자)
  // - 받지 않았으면 왼쪽 상태바의 상태(state)를 그대로 사용합니다.
  // - 성공 / 실패 문구와 아이콘도 함께 표시합니다.
  //
  const mirroredState =
    (readyState === "ready" || readyState === "loading" || readyState === "fail")
      ? readyState
      : (state === "ready" ? "ready" : (state === "error" ? "fail" : "loading"));

  setStep2ReadyBar(
    mirroredState,
    mirroredState === "ready"
      ? "✅ 노션 등록 가능"
      : (mirroredState === "fail"
        ? "❌ 노션 등록 불가"
        : "⏳ 노션 등록 준비 중...")
  );

}


// ⭐ ③-NEW. STEP 2 상단 오른쪽 "등록 가능 표시바" (신규 추가)
//
// 이 표시바는 "지금 노션 등록 버튼(아래 초록 버튼)을 누를 수 있는 상태인지"만 보여줍니다.
// 실제 등록은 기존과 똑같이 아래 하단 확인 버튼으로만 진행됩니다.
//
function setStep2ReadyBar(state, message) {

  const bar =
    document.getElementById("step2ReadyBar");

  if (!bar) return;


  const text =
    bar.querySelector(".step2-ready-text");

  if (text && typeof message === "string") {

    text.textContent = message;

  }


  const icon =
    bar.querySelector(".step2-ready-icon");

  if (icon) {

    icon.textContent =
      state === "ready"
        ? "✅"
        : (state === "fail" ? "❌" : "⏳");

  }


  bar.classList.toggle("step2-ready-bar-ready", state === "ready");

  bar.classList.toggle("step2-ready-bar-fail", state === "fail");

}


// ⭐ ④ 리스트에서 값 누르면 즉시 선택되는 속성 선택기 만들기
//     (제품 / 입출고 / 납품형태 / 제2배송지 공용)
function buildOptionPickerHtml(selectId, options, selectedValue, triggerLabel) {

  const list =
    Array.isArray(options) ? options : [];


  const target =
    selectedValue == null ? "" : String(selectedValue);


  const selected =
    list.find(function(option) {

      return String(option.value) === target;

    });


  const label =
    selected && String(selected.value) !== ""
      ? String(selected.label)
      : (triggerLabel || "선택하세요 ▼");


  let listHtml = "";


  list.forEach(function(option) {

    const isActive =
      String(option.value) === target;


    listHtml +=

      '<button ' +
        'type="button" ' +
        'class="option-picker-item' +
        (isActive ? " active" : "") +
        '" ' +
        'data-option-value="' +
        escapeAttribute(option.value) +
        '">' +

        escapeHtml(option.label) +

      '</button>';

  });


  return (

    '<button ' +
      'type="button" ' +
      'id="' + escapeAttribute(selectId) + 'Trigger" ' +
      'class="edit-input option-picker-trigger" ' +
      'data-option-target="' + escapeAttribute(selectId) + '">' +

      escapeHtml(label) +

    '</button>' +

    '<select ' +
      'id="' + escapeAttribute(selectId) + '" ' +
      'class="edit-select step-hidden"' +
    '>' +

      list.map(function(option) {

        return (

          '<option value="' +
            escapeAttribute(option.value) +
          '"' +

          (String(option.value) === target ? " selected" : "") +

          '>' +

          escapeHtml(option.label) +

          '</option>'

        );

      }).join("") +

    '</select>' +

    '<div ' +
      'id="' + escapeAttribute(selectId) + 'PickerList" ' +
      'class="option-picker-list step-hidden"' +
    '>' +

      listHtml +

    '</div>'

  );

}


// ⭐ ⑤ 선택기를 눌러서 값을 고르면 "바로" 저장되는 연결
function bindOptionPicker(selectId) {

  const select =
    document.getElementById(selectId);

  const trigger =
    document.getElementById(selectId + "Trigger");

  const list =
    document.getElementById(selectId + "PickerList");


  if (!select || !trigger || !list) return;


  trigger.addEventListener("click", function() {

    const wasHidden =
      list.classList.contains("step-hidden");


    // ⭐ 다른 선택기는 자동으로 닫아줍니다.
    document
      .querySelectorAll(".option-picker-list")
      .forEach(function(other) {

        if (other !== list) other.classList.add("step-hidden");

      });


    list.classList.toggle("step-hidden", !wasHidden);

  });


  list
    .querySelectorAll(".option-picker-item")
    .forEach(function(button) {

      button.addEventListener("click", function() {

        select.value =
          button.getAttribute("data-option-value");


        list
          .querySelectorAll(".option-picker-item")
          .forEach(function(other) {

            other.classList.toggle("active", other === button);

          });


        trigger.textContent =
          button.textContent;


        list.classList.add("step-hidden");


        // ⭐ 값이 바뀐 순간 바로 반영합니다. (완료 버튼 필요 없음)
        select.dispatchEvent(
          new Event("change", { bubbles: true })
        );

      });

    });

}


// ⭐ ⑥ 캘린더가 열리지 않는 브라우저용 간단 날짜 목록 (오늘부터 30일)
function renderDateQuickList(dateInput, dateList, dateTrigger) {

  let html = "";


  for (let i = 0; i < 30; i++) {

    const day = new Date();

    day.setDate(day.getDate() + i);


    const value =
      day.getFullYear() + "-" +
      String(day.getMonth() + 1).padStart(2, "0") + "-" +
      String(day.getDate()).padStart(2, "0");


    const label =
      i === 0
        ? "오늘 (" + value + ")"
        : (i === 1
            ? "내일 (" + value + ")"
            : value);


    html +=

      '<button ' +
        'type="button" ' +
        'class="option-picker-item' +
        (value === dateInput.value ? " active" : "") +
        '" ' +
        'data-date-value="' + value + '">' +

        label +

      '</button>';

  }


  dateList.innerHTML = html;


  dateList
    .querySelectorAll(".option-picker-item")
    .forEach(function(button) {

      button.addEventListener("click", function() {

        dateInput.value =
          button.getAttribute("data-date-value");


        dateTrigger.textContent =
          "📅 " + dateInput.value;


        dateList.classList.add("step-hidden");


        dateInput.dispatchEvent(
          new Event("change", { bubbles: true })
        );

      });

    });

}


// ⭐ ⑦ STEP 2가 그려질 때마다 선택기 / 날짜 / 수량 / X 버튼을 연결
function setupStep2Pickers() {

  ["productSelect", "modeSelect", "deliveryTypeSelect", "secondDeliverySelect"]
    .forEach(bindOptionPicker);


  // ⭐ 납품요청일 : 캘린더에서 날짜를 고르면 바로 반영됩니다.
  const dateTrigger =
    document.getElementById("deliveryDateTrigger");

  const dateInput =
    document.getElementById("deliveryDateInput");

  const dateList =
    document.getElementById("deliveryDatePicker");


  if (dateTrigger && dateInput && dateList) {

    dateTrigger.textContent =
      dateInput.value
        ? "📅 " + dateInput.value
        : "날짜를 선택하세요 ▼";


    dateTrigger.addEventListener("click", function() {

      try {

        if (typeof dateInput.showPicker === "function") {

          dateInput.showPicker();

          return;

        }

      } catch (error) {

        console.log("showPicker 오류:", error);

      }


      renderDateQuickList(dateInput, dateList, dateTrigger);

      dateList.classList.toggle("step-hidden");

    });


    dateInput.addEventListener("change", function() {

      dateTrigger.textContent =
        dateInput.value
          ? "📅 " + dateInput.value
          : "날짜를 선택하세요 ▼";


      // ⭐ 날짜를 선택하는 순간 실제 데이터에도 바로 반영
      if (currentPreviewData) {
        currentPreviewData.deliveryDate = dateInput.value;
      }


      // ⭐ 캘린더 바로 닫기
      dateList.classList.add("step-hidden");


      // ⭐ 화면의 거래내용 요약도 즉시 갱신
      renderTransactionSummary();

    });

  }


  // ⭐ 수량 : 기본값 1이 그대로 남아 있으면 지워서 바로 입력하게 합니다.
  const quantityInput =
    document.getElementById("quantityInput");


  if (quantityInput) {

    quantityInput.addEventListener("focus", function() {

      if (String(quantityInput.value) === "1") {

        quantityInput.value = "";

      }

    });


    quantityInput.addEventListener("blur", function() {

      if (!String(quantityInput.value).trim()) {

        quantityInput.value = "1";

        syncCurrentPreviewDataFromForm();

        renderTransactionSummary();

      }

    });

  }


  // ⭐ 선택된 거래처 오른쪽 X 버튼
  const clearButton =
    document.getElementById("selectedClientClearButton");


  if (clearButton) {

    clearButton.addEventListener("click", clearSelectedClient);

  }

}
