<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- 💡 아래 3줄 코드를 꼭 추가해 주세요! -->
  <link rel="manifest" href="manifest.json?v=1">
  <link rel="icon" href="R9.png?v=1" type="image/png">
  <link rel="apple-touch-icon" href="R9.png?v=1">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#05070b">

  <title>푸로찜 에스 음성 입출고 시스템</title>


  <style>

    /* ========================================================================
       ⭐ 기본
       ======================================================================== */

    * {
      box-sizing: border-box;
    }


    :root {

      --bg: #05070b;

      --card: rgba(255,255,255,.96);

      --text: #111827;

      --muted: #6b7280;

      --line: #e5e7eb;

      --green: #15803d;

      --red: #dc2626;

      --dark: #111827;

      --gold: #c9a227;

    }


    /* ========================================================================
       ⭐ 전체 배경
       ======================================================================== */

    body {

      margin: 0;

      padding: 0 14px 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      min-height: 100vh;

      position: relative;

      overflow-x: hidden;

      background:
        #05070b
        url("ronaldo-fenomeno.png")
        center top /
        cover
        fixed
        no-repeat;

    }


    /* ========================================================================
       ⭐ 전체 배경 어둡게 처리
       ======================================================================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -1;

      pointer-events: none;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.38) 0%,
          rgba(0,0,0,.55) 38%,
          rgba(0,0,0,.78) 100%
        );

    }


    /* ========================================================================
       ⭐ 황금빛 분위기
       ======================================================================== */

    body::after {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -1;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 8%,
          rgba(201,162,39,.20),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 45%,
          rgba(0,0,0,0),
          rgba(0,0,0,.35) 75%
        );

    }


    .container {

      max-width: 560px;

      margin: 0 auto;

      position: relative;

      z-index: 1;

    }


    /* ========================================================================
       ⭐ 화면 단계
       ======================================================================== */

    .screen {

      width: 100%;

    }


    #inputScreen {

      display: block;

    }


    #resultCard {

      display: block;

    }


    .step-hidden {

      display: none !important;

    }


    .step-indicator {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin: 4px 0 15px;

      font-size: 12px;

      font-weight: 800;

      color: #d1d5db;

      text-shadow:
        0 2px 5px rgba(0,0,0,.7);

    }


    .step-dot {

      width: 26px;

      height: 26px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(255,255,255,.22);

      color: #e5e7eb;

      font-size: 12px;

      font-weight: 900;

      border: 1px solid rgba(255,255,255,.18);

      backdrop-filter: blur(5px);

    }


    .step-dot.active {

      background: #c9a227;

      color: #111827;

      border-color: #e5c45b;

      box-shadow:
        0 0 14px rgba(201,162,39,.55);

    }


    .step-line {

      width: 35px;

      height: 2px;

      background: rgba(255,255,255,.25);

    }


    /* ========================================================================
       ⭐ HERO
       ======================================================================== */

    .hero {

      position: relative;

      margin: 0 -14px 18px;

      height: 285px;

      overflow: hidden;

      border-radius: 0 0 30px 30px;

      background:
        #05070b
        url("ronaldo-fenomeno.png")
        center 22% /
        cover
        no-repeat;

      box-shadow:
        0 14px 35px rgba(0,0,0,.45);

    }


    .hero-image {

      display: none;

    }


    .hero-overlay {

      position: absolute;

      inset: 0;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.05) 0%,
          rgba(0,0,0,.22) 30%,
          rgba(0,0,0,.88) 100%
        );

    }


    .hero-content {

      position: absolute;

      left: 22px;

      right: 22px;

      bottom: 18px;

      color: white;

      text-align: center;

      text-shadow:
        0 2px 8px rgba(0,0,0,.85),
        0 4px 18px rgba(0,0,0,.72);

    }


    .hero-kicker {

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 1px;

      font-size: 1px;

      line-height: 1;

      margin-bottom: 7px;

      color: #fff;

      text-align: center;

      transform: none;

      text-shadow: 0 4px 12px rgba(0,0,0,.95);

    }


    .kicker-name {

      font-family: Georgia, "Times New Roman", serif;

      font-size: 12px;

      font-weight: 700;

      font-style: normal;

      letter-spacing: 4.5px;

      color: #f4e5ae;

      text-shadow:
        0 1px 0 rgba(255,255,255,.55),
        0 3px 8px rgba(0,0,0,.9);

    }


    .kicker-crown {

      display: block;

      margin: -1px 0 -1px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 17px;

      line-height: .9;

      color: #f1c84b;

      text-shadow:
        0 1px 0 #fff0a0,
        0 2px 5px rgba(0,0,0,.95),
        0 0 12px rgba(239,192,47,.5);

    }


    .kicker-fenomeno {

      display: block;

      font-family: "Brush Script MT", "Segoe Print", "Bradley Hand", cursive;

      font-size: 29px;

      line-height: .9;

      font-weight: 900;

      font-style: italic;

      letter-spacing: 1px;

      color: #f3ca55;

      transform: skewX(-7deg) rotate(-1deg);

      text-shadow:
        1px 1px 0 #fff0a5,
        2px 3px 0 #a9750c,
        3px 5px 0 #684500,
        0 8px 15px rgba(0,0,0,.95),
        0 0 18px rgba(244,190,40,.42);

      -webkit-text-stroke: .45px rgba(255,232,142,.68);

    }


    .hero-title {

      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;

      font-size: 32px;

      line-height: 1.04;

      font-weight: 900;

      margin: 0;

      letter-spacing: 1.8px;

      color: #ffffff;

      text-shadow:
        0 2px 0 rgba(0,0,0,.85),
        0 4px 10px rgba(0,0,0,.92),
        0 0 20px rgba(255,255,255,.12);

    }


    .hero-sub {

      margin-top: 9px;

      font-size: 13px;

      line-height: 1.35;

      font-weight: 800;

      letter-spacing: 1.8px;

      color: #fff;

      opacity: 1;

      text-shadow:
        0 1px 0 rgba(255,255,255,.3),
        0 3px 10px rgba(0,0,0,.95);

    }


    /* ========================================================================
       ⭐ CARD
       ======================================================================== */

    .card {

      background:
        rgba(255,255,255,.95);

      border-radius: 22px;

      padding: 19px;

      margin-bottom: 16px;

      box-shadow:
        0 10px 32px rgba(0,0,0,.30);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

    }


    /* ========================================================================
       ⭐ 버튼 기본
       ======================================================================== */

    button {

      width: 100%;

      border: 1.5px solid rgba(232,194,70,.95);

      border-radius: 19px;

      padding: 15px 18px;

      font-size: 18px;

      font-weight: 900;

      letter-spacing: .2px;

      cursor: pointer;

      margin-top: 9px;

      transition:
        transform .12s ease,
        opacity .12s ease,
        box-shadow .12s ease;

      position: relative;

      overflow: hidden;

      text-shadow: 0 2px 5px rgba(0,0,0,.75);

      box-shadow:
        0 5px 16px rgba(0,0,0,.45),
        0 0 13px rgba(226,185,52,.18),
        inset 0 1px 0 rgba(255,245,190,.2);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

    }


    /* ========================================================================
       ⭐ 첫 화면 3개 메인 버튼 영역
       ======================================================================== */

    #inputScreen > .card:first-of-type {

      background: transparent;

      box-shadow: none;

      backdrop-filter: none;

      -webkit-backdrop-filter: none;

      padding: 0 8px 2px;

    }


    /* ========================================================================
       ⭐⭐⭐ 최종 메인 버튼
       ======================================================================== */

    #inputScreen > .card:first-of-type button {

      width: 170px;

      min-width: 170px;

      max-width: 170px;

      height: 56px;

      min-height: 56px;

      margin: 9px auto 0;

      padding: 0 12px;

      display: flex;

      flex-direction: row;

      align-items: center;

      justify-content: center;

      gap: 18px;

      border-radius: 16px;

      border: 1.5px solid #e5b83c;

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98) 0%,
          rgba(28,23,12,.97) 50%,
          rgba(6,7,8,.99) 100%
        );

      color: #fff;

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 0;

      line-height: 1;

      text-align: center;

      white-space: nowrap;

      text-shadow:
        0 2px 5px rgba(0,0,0,.95);

      box-shadow:

        0 5px 13px rgba(0,0,0,.58),

        0 0 9px rgba(226,181,48,.27),

        inset 0 1px 0 rgba(255,245,190,.18),

        inset 0 -1px 0 rgba(0,0,0,.85);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

    }


    /* ========================================================================
       ⭐ 최종 버튼 아이콘
       ======================================================================== */

    .main-button-icon {

      flex: 0 0 auto;

      width: auto;

      height: auto;

      border: 0;

      border-radius: 0;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      background: transparent;

      box-shadow: none;

      color: #efbd3d;

      text-shadow:
        0 0 7px rgba(240,194,65,.75);

    }


    /* ========================================================================
       ⭐ SVG는 사용하지 않음
       ======================================================================== */

    .main-button-icon svg {

      display: none;

    }


    /* ========================================================================
       ⭐ 버튼 글자
       ======================================================================== */

    .main-button-label {

      flex: 0 0 auto;

      min-width: 0;

      text-align: center;

      white-space: nowrap;

      color: #ffffff;

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 0;

      line-height: 1;

      display: inline-block;

    }


    /* ========================================================================
       ⭐ 오른쪽 화살표 제거
       ======================================================================== */

    #inputScreen > .card:first-of-type button::after {

      content: none;

    }


    /* ========================================================================
       ⭐ 버튼 위 금색 하이라이트
       ======================================================================== */

    #inputScreen > .card:first-of-type button::before {

      content: "";

      position: absolute;

      left: 12px;

      right: 12px;

      top: 0;

      height: 1px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,239,160,.78),
          transparent
        );

      pointer-events: none;

    }


    /* ========================================================================
       ⭐ 버튼 눌림
       ======================================================================== */

    #inputScreen > .card:first-of-type button:active {

      transform:
        translateY(1px)
        scale(.985);

      box-shadow:

        0 2px 8px rgba(0,0,0,.65),

        0 0 19px rgba(226,185,52,.42),

        inset 0 2px 4px rgba(0,0,0,.48),

        inset 0 1px 0 rgba(255,245,190,.24);

    }


    /* ========================================================================
       ⭐ 버튼별 미세한 색감
       ======================================================================== */

    #startButton {

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98),
          rgba(43,34,14,.95),
          rgba(7,8,8,.99)
        );

    }


    #finishButton {

      background:

        linear-gradient(
          135deg,
          rgba(7,7,8,.98),
          rgba(42,27,16,.95),
          rgba(7,8,8,.99)
        );

    }


    #directButton {

      background:

        linear-gradient(
          135deg,
          rgba(5,7,8,.98),
          rgba(43,35,15,.95),
          rgba(7,8,8,.99)
        );

    }


    /* ========================================================================
       ⭐⭐⭐ 비활성 완료 버튼
       ======================================================================== */

    #inputScreen > .card:first-of-type button:disabled {

      opacity: .42;

      cursor: not-allowed;

      filter:
        grayscale(.72)
        saturate(.35)
        brightness(.68);

      border-color: rgba(150,150,150,.55);

      background:

        linear-gradient(
          135deg,
          rgba(45,45,45,.92),
          rgba(70,70,70,.88),
          rgba(35,35,35,.94)
        );

      box-shadow:

        0 3px 8px rgba(0,0,0,.58),

        0 0 3px rgba(180,180,180,.08),

        inset 0 1px 0 rgba(255,255,255,.08),

        inset 0 -2px 5px rgba(0,0,0,.75);

    }


/* ========================================================================
   ⭐ statusCard
   ⭐ 첫 화면 하단 상태 표시 영역
   ======================================================================== */

#statusCard {

  position: sticky;

  top: 8px;

  z-index: 100;

  width: 100%;

  min-height: 50px;

  margin-top: 8px;

  box-sizing: border-box;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 12px 20px;

  background:
    rgba(5, 7, 11, 0.72);

  border:
    1px solid rgba(255, 215, 0, 0.20);

  border-radius: 22px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.06);

  backdrop-filter: blur(10px);

  -webkit-backdrop-filter: blur(10px);

  color: #ffffff;

  text-align: center;

  line-height: 1.6;

}


/* ⭐ 상태 표시 안의 내용도 정확히 가운데 */

#statusCard #inputResult {

  width: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

}


/* ⭐ 버튼 비활성화 */

button:disabled {

  cursor: not-allowed;

}


    /* ========================================================================
       ⭐ 확인 화면 버튼
       ======================================================================== */

    #confirmButton {

      background: var(--green);

      color: white;

    }


    #retryButton {

      background: #64748b;

      color: white;

    }


    #result {

      line-height: 1.7;

      font-size: 17px;

    }


    .listening {

      color: var(--red);

      font-weight: 800;

    }


    .success {

      color: var(--green);

      font-weight: 900;

      font-size: 19px;

    }


    .error {

      color: var(--red);

      font-weight: 800;

    }


    /* ========================================================================
       ⭐ 상태
       ======================================================================== */

    .timer {

      text-align: center;

      font-size: 14px;

      color: #6b7280;

      margin-top: 9px;

    }


    .loading {

      text-align: center;

      padding: 10px 0;

      color: #555;

      font-weight: 700;

    }


    /* ========================================================================
       ⭐ 확인 화면
       ======================================================================== */

    .preview-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;

    }


    /* ========================================================================
       ⭐⭐⭐ STEP 2 상단 왼쪽 버튼 묶음
       *
       * 기존 "← 입력 화면" 버튼 옆에
       * 새 "🔄 새로 고침" 버튼을 붙이기 위한 최소 추가 영역입니다.
       * ======================================================================== */

    .preview-actions {

      display: flex;

      align-items: center;

      gap: 6px;

      min-width: 0;

    }


    .preview-back {

      width: auto;

      margin: 0;

      padding: 8px 12px;

      border-radius: 10px;

      background: #f1f5f9;

      color: #475569;

      font-size: 13px;

      font-weight: 800;

    }


    /* ========================================================================
       ⭐⭐⭐ STEP 2 데이터 새로 고침 버튼
       *
       * 브라우저 전체 새로고침이 아닙니다.
       * 거래처 / 제품 / 납품형태 / 제2배송지 목록만
       * GAS에서 다시 받아옵니다.
       * ======================================================================== */

    .preview-refresh {

      width: auto;

      min-width: 0;

      margin: 0;

      padding: 8px 11px;

      border-radius: 10px;

      border: 1px solid #d7dbe1;

      background: #ffffff;

      color: #475569;

      font-size: 13px;

      font-weight: 800;

      line-height: 1.2;

      text-shadow: none;

      box-shadow:
        0 2px 6px rgba(0,0,0,.08);

      white-space: nowrap;

    }


    /* ========================================================================
       ⭐⭐⭐ STEP 2 푸로찜 총판 Home 열기 버튼
       *
       * "🔄 새로 고침" 옆에만 추가되는 작은 버튼입니다.
       * 기존 버튼 및 전체 button 기본 스타일은 건드리지 않습니다.
       * ======================================================================== */

    .preview-notion-home {

      width: auto;

      min-width: 0;

      margin: 0;

      padding: 8px 11px;

      border-radius: 10px;

      border: 1px solid #d7dbe1;

      background: #ffffff;

      color: #475569;

      font-size: 13px;

      font-weight: 800;

      line-height: 1.2;

      text-shadow: none;

      box-shadow:
        0 2px 6px rgba(0,0,0,.08);

      white-space: nowrap;

    }


    .preview-notion-home:hover {

      background: #f8fafc;

    }


    .preview-notion-home:active {

      transform:
        translateY(1px);

      box-shadow:
        0 1px 3px rgba(0,0,0,.10);

    }


    .preview-notion-home:focus {

      outline: none;

    }


    .preview-refresh:hover {

      background: #f8fafc;

    }


    .preview-refresh:active {

      transform:
        translateY(1px);

      box-shadow:
        0 1px 3px rgba(0,0,0,.10);

    }


    .preview-refresh:disabled {

      opacity: .58;

      cursor: wait;

    }


    .preview-step {

      font-size: 12px;

      font-weight: 900;

      color: #64748b;

      white-space: nowrap;

    }


    .preview-title {

      font-size: 22px;

      font-weight: 900;

      margin-bottom: 8px;

    }


    .preview-badge {

      display: inline-block;

      padding: 5px 9px;

      border-radius: 999px;

      background: #f3f4f6;

      color: #4b5563;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 18px;

    }


    .edit-row {

      margin-bottom: 16px;

    }


    .edit-label {

      display: block;

      color: #4b5563;

      font-size: 14px;

      font-weight: 800;

      margin-bottom: 7px;

    }


    .edit-input,
    .edit-select {

      width: 100%;

      padding: 14px;

      border: 1px solid #d7dbe1;

      border-radius: 12px;

      background: white;

      font-size: 17px;

      outline: none;

    }


    .edit-input:focus,
    .edit-select:focus {

      border-color: var(--green);

      box-shadow:
        0 0 0 3px rgba(21,128,61,.10);

    }


    .size-display {

      background: #f3f4f6;

      color: #555;

      cursor: not-allowed;

    }


    .help-text {

      margin-top: 5px;

      font-size: 12px;

      color: #777;

    }


    .original-text {

      background: #f3f4f6;

      padding: 14px;

      border-radius: 12px;

      margin-top: 18px;

      font-size: 15px;

      line-height: 1.6;

    }


    .button-group {

      margin-top: 19px;

    }


    /* ========================================================================
       ⭐ 거래처 검색 + 오른쪽 ▼ 선택
       ======================================================================== */

    .client-choice-row {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        150px;

      gap: 8px;

      align-items: stretch;

    }


    .client-search-wrap {

      position: relative;

      min-width: 0;

    }


    .client-search-input {

      padding-left: 43px;

    }


    .search-icon {

      position: absolute;

      left: 14px;

      top: 13px;

      font-size: 20px;

      z-index: 2;

      pointer-events: none;

    }


    #clientSelect {

      display: block;

      min-width: 0;

      cursor: pointer;

      padding-right: 10px;

    }


    .client-candidates {

      margin-top: 7px;

      border: 1px solid #e1e5ea;

      border-radius: 12px;

      overflow: hidden;

      background: white;

      max-height: 220px;

      overflow-y: auto;

    }


    .candidate-empty {

      padding: 13px;

      color: #777;

      font-size: 14px;

    }


    .candidate-item {

      width: 100%;

      text-align: left;

      border: 0;

      border-bottom: 1px solid #edf0f3;

      border-radius: 0;

      margin: 0;

      padding: 13px 14px;

      background: white;

      color: #111827;

      font-size: 16px;

      font-weight: 700;

    }


    .candidate-item:last-child {

      border-bottom: 0;

    }


    .candidate-item:hover {

      background: #f5f7fa;

    }


    .selected-client {

      margin-top: 8px;

// ============================================================================

//    1) sleep            : 정해진 시간만큼 쉬는 함수
//    2) fetchWithTimeout : 서버가 응답이 없으면 정해진 시간에 끊는 함수
//    3) 캐시 함수들       : 받은 데이터를 휴대폰에 저장해 두었다가 다시 쓰기
//    4) applyInitialData : 저장해 둔 데이터를 화면 목록에 채우기
//    5) warmupGasColdStart : 서버를 미리 깨워 두는 함수(웜업)
// ============================================================================

function sleep(ms) {

  return new Promise(
    function(resolve) {
      setTimeout(resolve, ms);
    }
  );

}


function fetchWithTimeout(ms) {

  if (
    typeof AbortController === "undefined"
  ) {

    return undefined;

  }

  const controller =
    new AbortController();

  setTimeout(
    function() {
      controller.abort();
    },
    ms
  );

  return controller.signal;

}


const INITIAL_DATA_CACHE_KEY =
  "procareInitialDataCacheV1";

const INITIAL_DATA_TIMEOUT_MS =
  24 * 60 * 60 * 1000;

const GAS_RESPONSE_CACHE_MS =
  5 * 60 * 1000;


function readInitialDataCache(
  key,
  maxAgeMs
) {

  try {

    if (!window.localStorage) {

      return null;

    }

    const raw =
      window.localStorage.getItem(key);

    if (!raw) {

      return null;

    }

    const parsed =
      JSON.parse(raw);

    if (
      !parsed ||
      typeof parsed.savedAt !== "number"
    ) {

      return null;

    }

    const maxAge =
      typeof maxAgeMs === "number"
        ? maxAgeMs
        : INITIAL_DATA_TIMEOUT_MS;

    if (
      Date.now() - parsed.savedAt > maxAge
    ) {

      window.localStorage.removeItem(key);

      return null;

    }

    return parsed.data || null;

  } catch (error) {

    return null;

  }

}


function writeInitialDataCache(key, data) {

  try {

    if (!window.localStorage) {

      return;

    }

    window.localStorage.setItem(
      key,
      JSON.stringify({
        savedAt: Date.now(),
        data: data
      })
    );

  } catch (error) {

    // 저장 공간이 부족하면 조용히 건너뜁니다.

  }

}


function applyInitialData(data) {

  clientList =
    Array.isArray(data.clients)

  productList =
    Array.isArray(data.products)
      ? data.products.slice()
      : [];

      : [];

  secondDeliveryLocationList =
    Array.isArray(data.secondDeliveryLocations)

      : [];

  clientList.sort(
    function(a, b) {

        String(b.name || ""),
        "ko"
      );

    }
  );

  productList =
    sortProductsByRequestedOrder(
      productList
    );

}

let currentPreviewData = null;

// ============================================================================
// 🧹 5. 텍스트 정리
// ============================================================================

function cleanText(text) {

  return String(text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// ============================================================================
// 🧹 6. 중복 문장 방지
// ============================================================================

function appendWithoutDuplicate(
  current,
  addition
) {

  addition =
    cleanText(addition);

  if (!addition)
    return current;

  if (!current)
    return addition;

  if (current === addition)
    return current;

  if (current.includes(addition))
    return current;

  if (addition.includes(current))
    return addition;

  return current + " " + addition;

}


// ============================================================================
// 👀 7. 현재 음성 화면
// ============================================================================

function showCurrentText() {

  const finalText =
    cleanText(
      finalTranscript
    );


  const interimText =
    cleanText(
      interimTranscript
    );


  displayedTranscript =
    cleanText(
      finalText +
      (
        interimText
          ? " " + interimText
          : ""
      )
    );


  inputResult.innerHTML =

    '<div class="listening">' +
    '🎙️ 듣고 있어요...<br><br>' +
    '</div>' +

    escapeHtml(
      displayedTranscript ||
      "말씀해주세요."
    );

}


// ============================================================================
// 🎙️ 8. 음성인식 시작
// ============================================================================

function startRecognition() {

  if (
    !SpeechRecognition ||
    !recognition ||
    recognitionRunning
  ) {

    return;

  }


  /*
   * 🆕 이미 예약되어 있는 자동 재시작이 있다면
   * 지금 직접 시작하는 순간 기존 예약을 취소합니다.
   *
   * 이렇게 해야 "이어서 말하기"를 직접 눌렀을 때
   * 기존 자동 재시작과 겹치지 않습니다.
   */
  if (recognitionRestartTimer) {

    clearTimeout(
      recognitionRestartTimer
    );

    recognitionRestartTimer =
      null;

  }


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "recognition.start 오류:",
      error
    );

  }

}


// ============================================================================
// 🟢 9. 말하기 시작 / 이어서 말하기
// ============================================================================

startButton.addEventListener(
  "click",
  function() {

    if (
      isSending ||
      !SpeechRecognition
    ) {

      return;

    }


    currentInputMode =
      "voice";


    if (isRecording) {

      finishRequested =
        false;

      startButton.disabled =
        true;

      finishButton.disabled =
        false;


      inputResult.innerHTML =

        '<div class="listening">' +
        '🎙️ 다시 듣고 있어요...<br><br>' +
        '</div>' +

        (
          displayedTranscript
            ? escapeHtml(
                displayedTranscript
              )
            : "말씀해주세요."
        );


      startRecognition();

      return;

    }


    pendingToken =
      null;

    finalTranscript =
      "";

    interimTranscript =
      "";

    displayedTranscript =
      "";

    finishRequested =
      false;

    isRecording =
      true;

    startButton.disabled =
      true;

    finishButton.disabled =
      false;

    directButton.disabled =
      true;


    setStartButtonLabel(
      "듣는 중"
    );


    timer.textContent =
      "";


    inputResult.innerHTML =
      '<div class="listening">' +
      '🎙️ 듣고 있어요...<br><br>' +
      '말씀해주세요.' +
      '</div>';


    recognition =
      new SpeechRecognition();


    recognition.lang =
      "ko-KR";

    recognition.continuous =
      true;

    recognition.interimResults =
      true;

    recognition.maxAlternatives =
      1;


    recognition.onresult =
      function(event) {

        let newFinal =
          "";

        let newInterim =
          "";


        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const transcript =
            cleanText(
              event.results[i][0].transcript
            );


          if (
            event.results[i].isFinal
          ) {

            newFinal =
              appendWithoutDuplicate(
                newFinal,
                transcript
              );

          } else {

            newInterim =
              appendWithoutDuplicate(
                newInterim,
                transcript
              );

          }

        }


        if (newFinal) {

          finalTranscript =
            appendWithoutDuplicate(
              finalTranscript,
              newFinal
            );

        }


        interimTranscript =
          newInterim;


        showCurrentText();

      };


    recognition.onend =
      function() {

        recognitionRunning =
          false;


        if (
          isRecording &&
          !finishRequested
        ) {

          /*
           * 🆕 기존의 "이어서 말하기" 수동 기능은 그대로 유지합니다.
           *
           * 모바일에서는 onend가 발생하더라도
           * 사용자가 직접 버튼을 누르지 않아도 되도록
           * 0.3초 후 자동으로 다시 시작합니다.
           *
           * ⭐ finishRequested === true이면
           * 사용자가 "말하기 완료"를 누른 것이므로
           * 절대로 자동 재시작하지 않습니다.
           */

          startButton.disabled =
            false;

          setStartButtonLabel(
            "이어서 말하기"
          );

          finishButton.disabled =
            false;


          if (displayedTranscript) {

            inputResult.innerHTML =
              escapeHtml(
                displayedTranscript
              );

          }


          /*
           * 🆕 혹시 같은 onend가 연속으로 발생하여
           * 기존 자동 재시작 예약이 남아 있다면
           * 먼저 취소하고 새로 하나만 예약합니다.
           */
          clearTimeout(
            recognitionRestartTimer
          );


          /*
           * 🆕 모바일 자동 재시작
           *
           * 300ms 정도만 기다린 뒤 다시 시작합니다.
           *
           * 너무 길게 기다리지 않으면서도
           * 모바일 브라우저가 recognition을 정리할
           * 아주 짧은 시간을 확보합니다.
           */
          recognitionRestartTimer =
            setTimeout(
              function() {

                recognitionRestartTimer =
                  null;


                /*
                 * 사용자가 그 사이에
                 * "말하기 완료"를 눌렀다면
                 * 절대로 다시 시작하지 않습니다.
                 */
                if (
                  isRecording &&
                  !finishRequested &&
                  recognition &&
                  !recognitionRunning
                ) {

                  startRecognition();

                }

              },
              300
            );

        }

      };


    recognition.onerror =
      function(event) {

        console.log(
          "음성인식 오류:",
          event.error
        );


        recognitionRunning =
          false;


        if (
          event.error ===
          "not-allowed"
        ) {

          inputResult.innerHTML =
            '<div class="error">' +
            '❌ 마이크 사용이 차단되었습니다.<br><br>' +
            '브라우저 주소창의 마이크 권한을 허용해주세요.' +
            '</div>';


          isRecording =
            false;

          finishRequested =
            true;

          startButton.disabled =
            false;

          setStartButtonLabel(
            "말하기 시작"
          );

          finishButton.disabled =
            true;

          directButton.disabled =
            false;

          return;

        }


        if (
          event.error === "no-speech" ||
          event.error === "aborted"
        ) {

          return;

        }

      };


    recognition.onstart =
      function() {

        recognitionRunning =
          true;


        /*
         * 🆕 자동 재시작이 성공하면
         * 사용자에게 다시 정상적으로 듣고 있다는 것을
         * 버튼 상태로 보여줍니다.
         *
         * 최초 "말하기 시작"에서도 동일한 상태이므로
         * 기존 화면 동작에는 변화가 없습니다.
         */
        if (
          isRecording &&
          !finishRequested
        ) {

          startButton.disabled =
            true;

          setStartButtonLabel(
            "듣는 중"
          );

          finishButton.disabled =
            false;

        }

      };


    startRecognition();


    clearTimeout(
      recordingTimer
    );


    recordingTimer =
      setTimeout(
        function() {

          if (isRecording) {

            finishRecording();

          }

        },
        30000
      );

  }
);

async function startDirectInput() {
  if (!initialDataReady) {
  inputResult.innerHTML =
    "📦 거래처와 상품정보를 불러오는 중입니다.<br><br>잠시만 기다려주세요.";
  return;
}

  if (isSending)
    return;


  currentInputMode =
    "direct";

  pendingToken =
    null;


  if (isRecording) {

    finishRecording();

    return;

  }


  isSending =
    true;


  directButton.disabled =
    true;

  startButton.disabled =
    true;

  finishButton.disabled =
    true;


  /*
   * ⭐⭐⭐ 핵심 개선
   *
   * 직접 입력 화면은 기존처럼 즉시 표시합니다.
   *
   * 단, 초기 데이터가 아직 도착하지 않았을 수 있으므로
   * 현재 미리보기 데이터를 전역에 보관합니다.
   *
   * 초기 데이터가 도착하면 loadInitialData()에서
   * showPreview()를 한 번 다시 호출하여
   * 거래처 / 제품 / 납품형태 / 제2배송지 목록을 채웁니다.
   */


  const defaultProduct =
    getDefault15Product();


  const localPreview = {

    status:
      "preview",

    token:
      null,

    clientPageId:
      "",

    productPageId:
      defaultProduct
        ? defaultProduct.id
        : "",

    productName:
      defaultProduct
        ? defaultProduct.name
        : "",

    size:
      "15 KG",

    quantity:
      1,

    mode:
      selectedTransactionMode,

    deliveryDate:
      getTodayLocal(),

    deliveryType:
      "직송",

    secondDeliveryLocation:
      "",

    memo:
      "",

    text:
      "직접 입력"

  };


  /*
   * ⭐ 현재 직접 입력 미리보기 데이터를 보관
   *
   * 초기 데이터가 늦게 도착해도
   * 그때 이 데이터를 이용하여 화면을 다시 생성합니다.
   */

  currentPreviewData =
    localPreview;


  /*
   * ⭐ STEP 2를 서버 응답보다 먼저 표시
   */

  showPreview(
    localPreview
  );


  /*
   * ⭐ 실제 Notion 등록에 필요한 토큰을 받을 때까지
   * 확인 버튼만 잠시 비활성화
   */

  const confirmButton =
    document.getElementById(
      "confirmButton"
    );


  if (confirmButton) {

    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "⏳ 등록 준비 중...";

  }


  try {

    /*
     * ⭐ 기존 GAS directPreview 호출은 그대로 유지
     *
     * 화면을 이미 보여준 뒤
     * 백그라운드에서 실행됩니다.
     */

    const data =
      await postToGAS({
        action:
          "directPreview",
        mode:
          selectedTransactionMode
      });


    if (
      data.status !==
      "preview"
    ) {

      throw new Error(
        data.message ||
        "직접 입력 등록 준비에 실패했습니다."
      );

    }


    /*
     * ⭐ 기존과 동일하게
     * GAS에서 받은 pendingToken을 저장
     */

    pendingToken =
      data.token;


    /*
     * ⭐ GAS에서 받은 실제 데이터도
     * 현재 미리보기 데이터로 갱신
     */

    currentPreviewData =
      data;


    /*
     * ⭐ 혹시 초기 데이터 로딩보다
     * directPreview가 먼저 끝난 경우를 대비
     *
     * 현재 목록이 아직 비어 있으면
     * 초기 데이터 도착 후 자동으로 다시 그려집니다.
     *
     * 초기 데이터가 이미 준비되어 있으면
     * 여기서 실제 GAS 결과를 바로 적용합니다.
     */

    if (
      clientList.length > 0 ||
      productList.length > 0 ||
      deliveryTypeList.length > 0 ||
      secondDeliveryLocationList.length > 0
    ) {

      showPreview(
        data
      );

    }


    /*
     * ⭐ 혹시 초기 데이터 로딩보다
     * directPreview가 먼저 끝난 경우를 대비하여
     * 실제 GAS 결과를 화면의 제품 선택값에 반영
     */

    const productSelect =
      document.getElementById(
        "productSelect"
      );


    const sizeInput =
      document.getElementById(
        "sizeInput"
      );


    if (
      productSelect &&
      data.productPageId
    ) {

      productSelect.value =
        data.productPageId;

    }


    if (
      sizeInput &&
      data.size
    ) {

      sizeInput.value =
        data.size;

    }


    /*
     * ⭐ 이제 실제 등록이 가능하므로
     * 확인 버튼 활성화
     */

    const readyConfirmButton =
      document.getElementById(
        "confirmButton"
      );


    if (readyConfirmButton) {

      readyConfirmButton.disabled =
        false;

      readyConfirmButton.textContent =
        "✅ 수정된 내용으로 Notion 등록";

    }


  } catch (error) {

    console.error(
      error
    );


    /*
     * ⭐ STEP 2 화면은 그대로 유지
     */

    const failedConfirmButton =
      document.getElementById(
        "confirmButton"
      );


    if (failedConfirmButton) {

      failedConfirmButton.disabled =
        true;

      failedConfirmButton.textContent =
        "⚠️ 등록 준비 실패";

    }


    const existingError =
      document.getElementById(
        "directPreviewError"
      );


    if (!existingError) {

      const errorBox =
        document.createElement(
          "div"
        );


      errorBox.id =
        "directPreviewError";


      errorBox.className =
        "error";


      errorBox.style.marginTop =
        "10px";


      errorBox.innerHTML =
        '❌ 직접 입력 등록 준비에 실패했어요.<br><br>' +
        escapeHtml(
          error.message ||
          String(error)
        );


      if (
        failedConfirmButton &&
        failedConfirmButton.parentElement
      ) {

        failedConfirmButton.parentElement.insertBefore(
          errorBox,
          failedConfirmButton
        );

      } else {

        previewResult.appendChild(
          errorBox
        );

      }

    }

  } finally {

    isSending =
      false;

    directButton.disabled =
      false;

  }

}

// ============================================================================
// 🛑 11. 녹음 종료
// ============================================================================

function finishRecording() {

  if (!isRecording)
    return;


  isRecording =
    false;

  finishRequested =
    true;


  clearTimeout(
    recordingTimer
  );


  /*
   * 🆕 혹시 모바일 자동 재시작이 예약되어 있다면
   * 사용자가 "말하기 완료"를 누른 순간 즉시 취소합니다.
   *
   * finishRequested=true 체크도 아래 자동 재시작 함수에
   * 들어 있지만, 타이머 자체도 여기서 정리하여
   * 불필요한 예약을 남기지 않습니다.
   */
  clearTimeout(
    recognitionRestartTimer
  );

  recognitionRestartTimer =
    null;


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        "recognition.stop 오류:",
        error
      );

    }

  }


  recognitionRunning =
    false;


  startButton.disabled =
    false;

  setStartButtonLabel(
    "말하기 시작"
  );

  finishButton.disabled =
    true;

  directButton.disabled =
    false;

  timer.textContent =
    "";


  const text =
    cleanText(
      finalTranscript ||
      displayedTranscript
    );


  if (!text) {

    inputResult.innerHTML =
      '<div class="error">' +
      '❌ 음성 내용을 듣지 못했어요.<br><br>' +
      '다시 말해주세요.' +
      '</div>';

    return;

  }


  finalizeAndSend(text);

}


// ============================================================================
// 📡 12. 분석 요청
// ============================================================================

function finalizeAndSend(text) {

  if (isSending)
    return;


  isSending =
    true;


  inputResult.innerHTML =
    '<div class="listening">' +
    '🔎 음성을 분석하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  sendAnalyzeToGAS(text);

}


// ============================================================================
// 📡 13. GAS POST 공통
// ============================================================================

async function postToGAS(payload) {

  // ⭐⭐⭐ [속도 개선 1] 읽기 요청(목록/분석 미리보기)은 잠시 동안
//        저장해 둔 답을 재사용합니다. 등록(쓰기) 요청은 절대 캐시하지 않습니다.
  const isReadAction =
    payload &&
    (payload.action === "initialData" ||
     payload.action === "analyze" ||
     payload.action === "directPreview");

  const cacheKey = isReadAction
    ? "gasCache:" +
      payload.action +
      ":" +
      String(payload.text || "")
    : null;

  if (cacheKey && !payload.forceFresh) {

    try {

      const cached =
        readInitialDataCache(
          cacheKey,
          GAS_RESPONSE_CACHE_MS
        );

      if (cached) {

        console.log(
          "⚡ 저장해 둔 응답 재사용:",
          payload.action
        );

        return cached;

      }

    } catch (cacheError) {

      // 캐시를 못 읽어도 새로 받으면 됩니다.

    }

  }

  // ⭐⭐⭐ [속도 개선 2] 읽기 요청은 최대 20초만 기다리고,
//        실패하면 최대 3번까지 다시 시도합니다.
//        등록(쓰기) 요청은 두 번 등록되는 사고가 생기면 안 되므로
//        원래 방식 그대로(재시도 없음) 진행합니다.
  const maxAttempts =
    isReadAction ? 3 : 1;

  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {

    try {

      const response =
        await fetch(
          GAS_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload),

            signal:
              isReadAction
                ? fetchWithTimeout(20000)
                : undefined

          }
        );


      const raw =
        await response.text();


      console.log(
        "GAS 응답:",
        raw
      );


      let data;


      try {

        data =
          JSON.parse(raw);

      } catch (jsonError) {

        throw new Error(
          "GAS 응답을 읽지 못했습니다.\n\n" +
          raw
        );

      }


      // ⭐ 성공한 읽기 답은 잠시 저장해 둡니다.
      if (cacheKey && data && data.status === "success") {

        try {

          writeInitialDataCache(cacheKey, data);

        } catch (cacheWriteError) {

          // 저장이 안 되어도 사용에는 문제가 없습니다.

        }

      }


      return data;

    } catch (attemptError) {

      lastError = attemptError;

      console.warn(
        "⚠️ GAS 요청 실패 (시도 " + attempt + "/" + maxAttempts + ")",
        attemptError && attemptError.message
          ? attemptError.message
          : attemptError
      );

      if (attempt < maxAttempts) {

        await sleep(500 * attempt);

      }

    }

  }


  throw lastError ||
    new Error("GAS에 연결하지 못했습니다.");

}

async function sendAnalyzeToGAS(text) {

  try {

    const data =
      await postToGAS({
        action: "analyze",
        text: text,
        mode: selectedTransactionMode
      });


    if (
      data.status !== "preview"
    ) {

      throw new Error(
        data.message ||
        "음성 분석에 실패했습니다."
      );

    }


    pendingToken =
      data.token;


    currentPreviewData =
      data;


    showPreview(data);


  } catch (error) {

    console.error(error);


    inputResult.innerHTML =

      '<div class="error">' +
      '❌ 분석하지 못했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button id="analyzeRetryButton" ' +
      'style="background:#64748b;color:white;">' +

      '</button>' +

      '</div>';

      .getElementById(

      )
      .addEventListener(

      );


  } finally {

      false;

  }

}

async function loadInitialData() {

  initialDataLoading = true;
  initialDataReady = false;
  
  try {

    const data =
      await postToGAS({
        action: "initialData",
        forceFresh: true
      });


    // ⭐⭐⭐ [속도 개선 3] 받아온 목록을 휴대폰에 저장해 둡니다.
//        다음에 앱을 열면 이 저장해 둔 데이터를 먼저 보여주고,
//        새 데이터는 조용히 그 뒤에 받아서 바꿔치기합니다.
    writeInitialDataCache(
      INITIAL_DATA_CACHE_KEY,
      data
    );


    if (
      data.status !== "success"
    ) {

      throw new Error(
        data.message ||
        "초기 데이터를 가져오지 못했습니다."
      );

    }


    clientList =
      Array.isArray(data.clients)
        ? data.clients.slice()
        : [];


    productList =
      Array.isArray(data.products)
        ? data.products.slice()
        : [];


    deliveryTypeList =
      Array.isArray(data.deliveryTypes)
        ? data.deliveryTypes
        : [];


    secondDeliveryLocationList =
      Array.isArray(
        data.secondDeliveryLocations
      )
        ? data.secondDeliveryLocations
        : [];


    clientList.sort(
      function(a, b) {

        return String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          ),
          "ko"
        );

      }
    );


    productList =
      sortProductsByRequestedOrder(
        productList
      );
    // ⭐⭐⭐ [속도 개선 4] 서버를 미리 깨워 둡니다(웜업).
//        덕분에 나중에 음성을 말할 때 첫 분석이 빨라집니다.
    warmupGasColdStart();

    // ⭐⭐⭐ 앱 시작 시 필요한 초기 데이터가 모두 준비되었습니다.
    initialDataReady = true;
    initialDataLoading = false;

    console.log(
      "✅ 앱 초기 데이터 준비 완료"
    );

    console.log(
      "거래처 수:",
      clientList.length
    );


    console.log(
      "제품 수:",
      productList.length
    );


    console.log(
      "납품형태 옵션:",
      deliveryTypeList
    );


    console.log(
      "제2배송지 옵션:",
      secondDeliveryLocationList
    );


    /*
     * ======================================================================
     * ⭐⭐⭐ 이번 문제의 핵심 수정
     *
     * 직접 입력을 누르는 순간에는 화면을 먼저 보여주기 때문에
     * initialData가 아직 도착하지 않았을 수 있습니다.
     *
     * initialData가 도착한 지금,
     * 현재 직접 입력 STEP 2가 열려 있다면
     * 동일한 데이터를 이용해 화면을 한 번 다시 그립니다.
     *
     * 따라서:
     *
     * 직접 입력
     * → 즉시 STEP 2
     * → initialData 도착
     * → 거래처/제품/납품형태/제2배송지 자동 채움
     *
     * 기존 음성인식 동작에는 영향을 주지 않습니다.
     * ======================================================================
     */

    if (
      currentInputMode === "direct" &&
      currentPreviewData &&
      !resultCard.classList.contains(
        "step-hidden"
      )
    ) {

      /*
       * ⭐ 서버 directPreview가 아직 오지 않았다면
       * 처음 만들어 둔 localPreview를 다시 사용합니다.
       *
       * 서버 directPreview가 이미 왔다면
       * currentPreviewData에 서버 데이터가 들어 있으므로
       * 그 데이터를 그대로 사용합니다.
       */

      showPreview(
        currentPreviewData
      );


      /*
       * ⭐ directPreview가 아직 처리 중이면
       * 등록 버튼은 다시 비활성 상태로 유지합니다.
       *
       * directPreview가 완료되면
       * startDirectInput()에서 다시 활성화합니다.
       */

      if (!pendingToken) {

        const confirmButton =
          document.getElementById(
            "confirmButton"
          );


        if (confirmButton) {

          confirmButton.disabled =
            true;

          confirmButton.textContent =
            "⏳ 등록 준비 중...";

        }

      }

    }


  } catch (error) {

    initialDataLoading = false;
    initialDataReady = false;
    
    console.error(
      "초기 데이터 오류:",
      error
    );


    // ⭐⭐⭐ [속도 개선 5] 저장해 둔 데이터가 있으면
//        무서운 빨간 에러 대신 안내 문구를 보여줍니다.
    if (readInitialDataCache(INITIAL_DATA_CACHE_KEY)) {

      inputResult.innerHTML =
        "⚡ 저장해 둔 거래처 / 제품으로 계속할 수 있어요.<br><br>새로운 정보는 인터넷이 안정되면 자동으로 업데이트됩니다.";

    } else {

      inputResult.innerHTML =
        '<div class="error">' +
        '❌ 거래처 / 제품 목록을 가져오지 못했습니다.<br><br>' +
        escapeHtml(
          error.message ||
          String(error)
        ) +
        '</div>';

    }

  }

}

// 보존 대상:

    clientPageId:

        "clientSelect"

      document.getElementById(
        "productSelect"
      )?.value || "",

    quantity:

        "quantityInput"
      )?.value || "1",

    mode:

        "modeSelect"
      )?.value || "출고",

        "deliveryDateInput"
      )?.value ||

      document.getElementById(
        "deliveryTypeSelect"
      )?.value ||

    secondDeliveryLocation:
      document.getElementById(
        "secondDeliverySelect"
      )?.value || "",

    memo:
      document.getElementById(
        "memoInput"
      )?.value || ""

  };


  /*
   * ⭐ 현재 등록 준비 상태도 기억합니다.
   *
   * 직접 입력을 누른 직후 아직 directPreview가 끝나지 않았다면
   * pendingToken이 없을 수 있습니다.
   *
   * 이 상태를 새로고침 후에도 그대로 유지합니다.
   */

  const hadPendingToken =
    !!pendingToken;


  /*
   * ⭐ 버튼을 잠시 비활성화하여
   * 사용자가 여러 번 연속으로 누르는 것을 방지합니다.
   */

  if (refreshButton) {

    refreshButton.disabled =
      true;

    refreshButton.textContent =
      "⏳ 새로 고침 중...";

  }


  try {

    /*
     * ⭐ 기존에 정상적으로 사용 중인
     * loadInitialData()를 그대로 재사용합니다.
     *
     * 별도의 GAS 함수나 별도의 데이터 구조를 만들지 않습니다.
     */

    await loadInitialData();


    /*
     * ⭐ loadInitialData()가 끝나면
     * 최신 거래처 / 제품 / Select 목록이 준비되어 있습니다.
     *
     * 그 최신 목록을 사용하면서
     * 방금 전 STEP 2에서 사용자가 선택했던 값은 다시 적용합니다.
     */

    if (
      currentPreviewData
    ) {

      const restoredPreview = {

        ...currentPreviewData,

        clientPageId:
          currentValues.clientPageId,

        productPageId:
          currentValues.productPageId,

        quantity:
          currentValues.quantity,

        mode:
          currentValues.mode,

        deliveryDate:
          currentValues.deliveryDate,

        deliveryType:
          currentValues.deliveryType,

        secondDeliveryLocation:
          currentValues.secondDeliveryLocation,

        memo:
          currentValues.memo

      };


      /*
       * ⭐ 최신 목록 + 기존 입력값을 합쳐서
       * STEP 2를 다시 그립니다.
       */

      showPreview(
        restoredPreview
      );


      /*
       * ⭐ pendingToken이 아직 없었다면
       * 확인 버튼도 다시 비활성화합니다.
       *
       * 반대로 pendingToken이 있었다면
       * 정상적으로 등록 버튼을 사용할 수 있습니다.
       */

      if (!hadPendingToken) {

        const confirmButton =
          document.getElementById(
            "confirmButton"
          );


        if (confirmButton) {

          confirmButton.disabled =
            true;

          confirmButton.textContent =
            "⏳ 등록 준비 중...";

        }

      }

    }


    console.log(
      "🔄 STEP 2 초기 데이터 새로 고침 완료"
    );


  } catch (error) {

    console.error(
      "STEP 2 초기 데이터 새로 고침 오류:",
      error
    );


    /*
     * ⭐ 새로고침 실패해도
     * 현재 화면과 기존 입력값은 최대한 그대로 유지합니다.
     */

    alert(
      "거래처 / 제품 목록 새로 고침에 실패했습니다.\n\n" +
      (
        error.message ||
        String(error)
      )
    );

  } finally {

    /*
     * ⭐ 새로고침이 끝나면 버튼을 원래 상태로 복구합니다.
     */

    if (refreshButton) {

      refreshButton.disabled =
        false;

      refreshButton.textContent =
        "🔄 새로 고침";

    }

  }

}


// ============================================================================
// 📋 15-1. 제품 표시 순서
// ============================================================================

function sortProductsByRequestedOrder(
  products
) {

  const order = {

    "15 KG": 0,

    "20 KG": 1,

    "12 KG": 2

  };


  return products
    .slice()
    .sort(
      function(a, b) {

        const aSize =
          getProductSize(
            a.name
          );


        const bSize =
          getProductSize(
            b.name
          );


        const ai =
          Object.prototype
            .hasOwnProperty
            .call(
              order,
              aSize
            )
              ? order[aSize]
              : 99;


        const bi =
          Object.prototype
            .hasOwnProperty
            .call(
              order,
              bSize
            )
              ? order[bSize]
              : 99;


        if (
          ai !== bi
        ) {

          return ai - bi;

        }


        return String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          ),
          "ko"
        );

      }
    );

}


// ============================================================================
// 📏 15-2. 제품명에서 규격 찾기
// ============================================================================

function getProductSize(
  productName
) {

  const text =
    String(
      productName || ""
    );


  if (
    /12\s*KG/i.test(text)
  )
    return "12 KG";


  if (
    /15\s*KG/i.test(text)
  )
    return "15 KG";


  if (
    /20\s*KG/i.test(text)
  )
    return "20 KG";


  return "";

}


// ============================================================================
// 🚚 15-3. 납품형태 정규화
// ⭐⭐⭐ 기존 코드 그대로 유지
// ============================================================================

function normalizeDeliveryType(
  value,
  options
) {

  const list =
    Array.isArray(options)
      ? options
      : [];


  const raw =
    cleanText(value);


  const exact =
    list.find(
      function(option) {

        return cleanText(option) === raw;

      }
    );


  if (exact) {

    return exact;

  }


  const compact =
    raw
      .toLowerCase()
      .replace(/\s+/g, "");


  const isParcel =
    compact.includes("택배") ||
    compact.includes("택배발송") ||
    compact.includes("택배송");


  if (isParcel) {

    const parcelOption =
      list.find(
        function(option) {

          const optionCompact =
            cleanText(option)
              .toLowerCase()
              .replace(/\s+/g, "");


          return optionCompact.includes(
            "택배"
          );

        }
      );


    if (parcelOption) {

      return parcelOption;

    }

  }


  const directOption =
    list.find(
      function(option) {

        const optionCompact =
          cleanText(option)
            .toLowerCase()
            .replace(/\s+/g, "");


        return optionCompact === "직송";

      }
    );


  if (directOption) {

    return directOption;

  }


  return "직송";

}


// ============================================================================
// 🚚 15-4. 납품형태 Select 옵션 생성
// ⭐⭐⭐ 기존 코드 그대로 유지
// ============================================================================

function buildDeliveryTypeOptions(
  selectedDeliveryType
) {

  const selected =
    normalizeDeliveryType(
      selectedDeliveryType,
      deliveryTypeList
    );


  const options =
    Array.isArray(deliveryTypeList) &&
    deliveryTypeList.length > 0
      ? deliveryTypeList
      : ["직송"];


  return options
    .map(
      function(option) {

        const isSelected =
          cleanText(option) ===
          cleanText(selected);


        return (

          '<option value="' +
            escapeAttribute(
              option
            ) +
          '"' +

          (
            isSelected
              ? " selected"
              : ""
          ) +

          '>' +

          escapeHtml(
            option
          ) +

          '</option>'

        );

      }
    )
    .join("");

}


// ============================================================================
// 👀 16. 미리보기 / 확인 화면
// ============================================================================

function showPreview(data) {

  /*
   * ⭐⭐⭐ 현재 미리보기 데이터를 보관
   *
   * initialData가 나중에 도착했을 때
   * 동일한 STEP 2를 다시 그릴 수 있도록 합니다.
   */

  currentPreviewData =
    data;


  const defaultProduct =
    getDefault15Product();


  if (
    !data.productPageId &&
    defaultProduct
  ) {

    data.productPageId =
      defaultProduct.id;

    data.productName =
      defaultProduct.name;

    data.size =
      "15 KG";

  }


  // ⭐ 입고를 미리 선택했고 음성에서 거래처를 따로 말하지 않은 경우
  // 현대바이오랜드를 기본 거래처로 사용합니다. 사용자가 Step 2에서 변경할 수 있습니다.
  if (
    data.mode === "입고" &&
    !data.clientPageId
  ) {

    const inboundDefaultClient =
      clientList.find(
        function(item) {
          return String(item.name || "") === "현대바이오랜드";
        }
      );

    if (inboundDefaultClient) {
      data.clientPageId = inboundDefaultClient.id;
      data.clientName = inboundDefaultClient.name;
    }

  }


  const client =
    clientList.find(
      function(item) {

        return String(item.id) ===
          String(
            data.clientPageId || ""
          );

      }
    );


  let productOptions =
    "";


  productList.forEach(
    function(product) {

      const selected =
        String(product.id) ===
        String(
          data.productPageId || ""
        )
          ? " selected"
          : "";


      productOptions +=

        '<option value="' +
        escapeAttribute(
          product.id
        ) +
        '"' +
        selected +

// 💰 16-0. 주소 / 단가 / 무게 표시
// ============================================================================

function renderTransactionSummary() {

  const summary =
    document.getElementById("transactionSummary");

  const addressBox =
    document.getElementById("clientAddressSummary");

  const clientSelect =
    document.getElementById("clientSelect");

  const productSelect =
    document.getElementById("productSelect");

  const quantityInput =
    document.getElementById("quantityInput");

  const modeSelect =
    document.getElementById("modeSelect");

  const sizeInput =
    document.getElementById("sizeInput");

  if (!summary || !clientSelect || !productSelect || !quantityInput || !modeSelect || !sizeInput) {
    return;
  }

  const mode = modeSelect.value || selectedTransactionMode || "출고";
  const client = clientList.find(function(item) {
    return String(item.id) === String(clientSelect.value || "");
  });

  const quantity = Number(quantityInput.value || 0);
  const sizeMatch = String(sizeInput.value || "").match(/(12|15|20)\s*KG/i);
  const kg = sizeMatch ? Number(sizeMatch[1]) : 0;
  const totalWeight = kg * quantity;

  if (mode === "입고") {
    if (addressBox) addressBox.innerHTML = "";
    summary.innerHTML =
      '<span>총 무게: ' + totalWeight.toLocaleString("ko-KR") + ' KG</span>';
    return;
  }

  if (addressBox) {
    const address = client ? String(client.address || "").trim() : "";
    if (address) {
      addressBox.innerHTML =
        '<div class="client-address-line">' +
          '<span>주소: ' + escapeHtml(address) + '</span>' +
          '<button type="button" class="tmap-button" id="tmapButton">TMAP</button>' +
        '</div>';

      const tmapButton = document.getElementById("tmapButton");
      if (tmapButton) {
        tmapButton.addEventListener("click", function() {
          const url =
            "tmap://search?name=" +
            encodeURIComponent(address);
          window.location.href = url;
        });
      }
    } else {
      addressBox.innerHTML = "";
    }
  }

  const unitPrice = client ? Number(client.unitPrice || 0) : 0;
  const salesAmount = unitPrice * quantity;

  summary.innerHTML =
    '<span>단가: ' + unitPrice.toLocaleString("ko-KR") + '원</span>' +
    '<span>판매금: ' + salesAmount.toLocaleString("ko-KR") + '원</span>' +
    '<span>총 무게: ' + totalWeight.toLocaleString("ko-KR") + ' KG</span>';

}

function setupClientSearch(
  initialClientId
) {

  const input =
    document.getElementById(
      "clientSearchInput"
    );


  const candidates =
    document.getElementById(
      "clientCandidates"
    );


  const selectedBox =
    document.getElementById(
      "selectedClient"
    );


  const clientSelect =
    document.getElementById(
      "clientSelect"
    );


  if (
    !input ||
    !candidates ||
    !selectedBox ||
    !clientSelect
  ) {

    return;

  }


  // ⭐ 거래처 검색 버튼: 아래로 검색 패널 열기 / 닫기
  const searchPanel =
    document.getElementById(
      "clientSearchPanel"
    );

  const searchToggleButton =
    document.getElementById(
      "clientSearchToggleButton"
    );

  if (searchToggleButton && searchPanel) {

    searchToggleButton.addEventListener(
      "click",
      function() {

        searchPanel.classList.toggle(
          "step-hidden"
        );

        if (
          !searchPanel.classList.contains(
            "step-hidden"
          )
        ) {

          renderCandidates();

            document
    .getElementById(
      "clientSearchInput"
    )
    .focus();

        }

      }
    );

  }


  function normalizeSearchText(
    value
  ) {

    return String(
      value || ""
    )
      .toLowerCase()
      .replace(
        /\s+/g,
        ""
      )
      .trim();

  }


  function selectClient(
    client
  ) {

    clientSelect.value =
      client.id;


    input.value =
      client.name;


    selectedBox.style.display =
      "block";


    selectedBox.innerHTML =
      "✅ 선택된 거래처: " +
      escapeHtml(
        client.name
      );

    const pickerButton =
      document.getElementById("clientPickerButton");

    if (pickerButton) {
      pickerButton.textContent =
        "🏢 " + client.name;
    }

    renderTransactionSummary();


    candidates.innerHTML =
      "";


    if (searchPanel) {

      searchPanel.classList.add(
        "step-hidden"
      );

    }

  }


  function bindCandidateButtons() {

    candidates
      .querySelectorAll(
        ".candidate-item"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              const client =
                clientList.find(
                  function(item) {

                    return String(
                      item.id
                    ) ===
                    String(
                      button.getAttribute(
                        "data-client-id"
                      )
                    );

                  }
                );


              if (client) {

                selectClient(
                  client
                );

              }

            }
          );

        }
      );

  }


  function renderCandidates() {

    const keyword =
      normalizeSearchText(
        input.value
      );


    if (!keyword) {

      const allListHtml =
        clientList
          .map(
            function(client) {

              return (

                '<button ' +
                'type="button" ' +
                'class="candidate-item" ' +
                'data-client-id="' +
                escapeAttribute(
                  client.id
                ) +
                '">' +

                '🏢 ' +

                escapeHtml(
                  client.name
                ) +

                '</button>'

              );

            }
          )
          .join("");

      candidates.innerHTML =
        allListHtml;

      bindCandidateButtons();

      return;

    }


    const matches =
      clientList.filter(
        function(client) {

          return normalizeSearchText(
            client.name
          ).includes(
            keyword
          );

        }
      );


    if (
      matches.length === 0
    ) {

      candidates.innerHTML =
        '<div class="candidate-empty">' +
        '찾는 거래처가 없습니다. 다른 검색어를 입력해보세요.' +
        '</div>';

      return;

    }


    candidates.innerHTML =
      matches
        .map(
          function(client) {

            return (

              '<button ' +
              'type="button" ' +
              'class="candidate-item" ' +
              'data-client-id="' +
              escapeAttribute(
                client.id
              ) +
              '">' +

              '🏢 ' +

              escapeHtml(
                client.name
              ) +

              '</button>'

            );

          }
        )
        .join("");


    bindCandidateButtons();

  }


  input.addEventListener(
    "input",
    function() {

      clientSelect.value =
        "";


      selectedBox.style.display =
        "none";


      renderCandidates();

    }
  );


  input.addEventListener(
    "focus",
    function() {

      if (input.value) {

        renderCandidates();

      }

    }
  );


  clientSelect.addEventListener(
    "change",
    function() {

      const selectedId =
        clientSelect.value;


      if (!selectedId) {

        selectedBox.style.display =
          "none";

        return;

      }


      const client =
        clientList.find(
          function(item) {

            return String(
              item.id
            ) ===
            String(
              selectedId
            );

          }
        );


      if (client) {

        selectClient(
          client
        );

      }

    }
  );


  if (initialClientId) {

    const initialClient =
      clientList.find(
        function(item) {

          return String(
            item.id
          ) ===
          String(
            initialClientId
          );

        }
      );


    if (initialClient) {

      selectClient(
        initialClient
      );

    }

  } else {

    renderCandidates();

  }

}

function getDefault15Product() {

}


// ============================================================================
// 📅 16-3. 오늘 날짜
// ============================================================================

function getTodayLocal() {

  const now =
    new Date();


  const y =
    now.getFullYear();


  const m =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const d =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}


// ============================================================================
// 🔐 17. 사용자가 최종 확인 → Notion 등록
// ============================================================================

async function confirmNotionRegistration() {

  if (!pendingToken) {

    previewResult.innerHTML =
      '<div class="error">' +
      '❌ 확인 시간이 만료되었어요.<br><br>' +
      '다시 입력해주세요.' +
      '</div>';

    return;

  }


  if (isSending)
    return;


  const clientSelect =
    document.getElementById(
      "clientSelect"
    );


  const productSelect =
    document.getElementById(
      "productSelect"
    );


  const quantityInput =
    document.getElementById(
      "quantityInput"
    );


  const modeSelect =
    document.getElementById(
      "modeSelect"
    );


  const deliveryDateInput =
    document.getElementById(
      "deliveryDateInput"
    );


  const sizeInput =
    document.getElementById(
      "sizeInput"
    );


  const deliveryTypeSelect =
    document.getElementById(
      "deliveryTypeSelect"
    );


  const secondDeliverySelect =
    document.getElementById(
      "secondDeliverySelect"
    );


  if (
    !clientSelect ||
    !productSelect ||
    !quantityInput ||
    !modeSelect ||
    !deliveryDateInput ||
    !sizeInput ||
    !deliveryTypeSelect ||
    !secondDeliverySelect
  ) {

    previewResult.innerHTML =
      '<div class="error">' +
      '❌ 등록 화면을 읽지 못했습니다.<br><br>' +
      '다시 입력해주세요.' +
      '</div>';

    return;

  }


  const clientPageId =
    clientSelect.value;


  const productPageId =
    productSelect.value;


  const quantity =
    Number(
      quantityInput.value
    );


  const mode =
    modeSelect.value;


  const deliveryDate =
    deliveryDateInput.value;


  const size =
    sizeInput.value;


  const deliveryType =
    deliveryTypeSelect.value;


  const secondDeliveryLocation =
    secondDeliverySelect.value;


  const memoInput =
    document.getElementById(
      "memoInput"
    );


  const memo =
    String(
      (memoInput && memoInput.value) || ""
    ).trim();


  if (!clientPageId) {

    alert(
      "거래처를 선택해주세요."
    );

    clientSelect.focus();

    return;

  }


  if (!productPageId) {

    alert(
      "제품을 선택해주세요."
    );

    productSelect.focus();

    return;

  }


  if (
    !Number.isInteger(
      quantity
    ) ||
    quantity <= 0
  ) {

    alert(
      "수량은 1박스 이상의 정수로 입력해주세요."
    );

    quantityInput.focus();

    return;

  }


  if (
    mode !== "입고" &&
    mode !== "출고"
  ) {

    alert(
      "입고 또는 출고를 선택해주세요."
    );

    modeSelect.focus();

    return;

  }


  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(
      deliveryDate
    )
  ) {

    alert(
      "납품요청일을 선택해주세요."
    );

    deliveryDateInput.focus();

    return;

  }


  if (
    size !== "12 KG" &&
    size !== "15 KG" &&
    size !== "20 KG"
  ) {

    alert(
      "제품 규격을 확인해주세요."
    );

    return;

  }


  if (!deliveryType) {

    alert(
      "납품형태를 선택해주세요."
    );

    deliveryTypeSelect.focus();

    return;

  }


  isSending =
    true;


  const confirmButton =
    document.getElementById(
      "confirmButton"
    );


  const retryButton =
    document.getElementById(
      "retryButton"
    );


  if (confirmButton) {

    confirmButton.disabled =
      true;

    confirmButton.textContent =
      "⏳ 노션에 등록 중...";

  }


  if (retryButton) {

    retryButton.disabled =
      true;

  }


  previewResult.innerHTML =
    '<div class="listening">' +
    '📝 노션에 등록하고 있어요...<br><br>' +
    '잠시만 기다려주세요.' +
    '</div>';


  try {

    const data =
      await postToGAS({

        action:
          "confirm",

        token:
          pendingToken,

        clientPageId:
          clientPageId,

        productPageId:
          productPageId,

        quantity:
          quantity,

        mode:
          mode,

        size:
          size,

        deliveryDate:
          deliveryDate,

        deliveryType:
          deliveryType,

        secondDeliveryLocation:
          secondDeliveryLocation,

        memo:
          memo

      });


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.message ||
        "Notion 등록에 실패했습니다."
      );

    }


    pendingToken =
      null;

    currentPreviewData =
      null;


    previewResult.innerHTML =

      '<div class="step-indicator">' +

        '<div class="step-dot">' +
          '1' +
        '</div>' +

        '<div class="step-line"></div>' +

        '<div class="step-dot">' +
          '2' +
        '</div>' +

        '<div class="step-line"></div>' +

        '<div class="step-dot active">' +
          '3' +
        '</div>' +

      '</div>' +


      '<div class="preview-step" ' +
      'style="margin-bottom:8px;">' +
        'STEP 3 · 완료' +
      '</div>' +


      '<div class="success">' +
        '🎉 노션 등록 완료!' +
      '</div>' +

      '<br>' +

      '<strong>' +
        escapeHtml(
          data.clientName
        ) +
      '</strong>' +

      ' / ' +

      escapeHtml(
        data.productName
      ) +

      ' / ' +

      escapeHtml(
        String(
          data.quantity
        ) +
        "박스"
      ) +

      ' / ' +

      escapeHtml(
        data.mode
      ) +

      '<br><br>' +

      '📏 규격: ' +
      escapeHtml(
        data.size
      ) +

      '<br>' +

      '📅 납품요청일: ' +
      escapeHtml(
        data.deliveryDate
      ) +

      '<br>' +

      '🚚 납품형태: ' +
      escapeHtml(
        data.deliveryType ||
        ''
      ) +

      '<br>' +

      '📍 제2배송지: ' +
      escapeHtml(
        data.secondDeliveryLocation ||
        '없음'
      );


    if (data.notionUrl) {

      previewResult.innerHTML +=

        '<br><br>' +

        '<a ' +
        'href="' +
        escapeAttribute(
          data.notionUrl
        ) +
        '" ' +
        'target="_blank" ' +
        'style="font-size:16px;"' +
        '>' +

        '🔗 노션 페이지 열기' +

        '</a>';

    }


    previewResult.innerHTML +=

      '<div class="button-group">' +

        '<button ' +
        'id="newRecordButton" ' +
        'style="background:#111827;color:white;"' +
        '>' +

        '🎙️ 새 입출고 입력' +

        '</button>' +

      '</div>';


    document
      .getElementById(
        "newRecordButton"
      )
      .addEventListener(
        "click",
        resetForNewRecording
      );


  } catch (error) {

    console.error(
      error
    );


    previewResult.innerHTML =

      '<div class="error">' +
      '❌ 노션 등록에 실패했어요.<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      '</div>' +

      '<div class="button-group">' +

      '<button id="confirmRetryButton" ' +
      'style="background:#64748b;color:white;">' +
      '🔄 다시 입력' +
      '</button>' +

      '</div>';


    document
      .getElementById(
        "confirmRetryButton"
      )
      .addEventListener(
        "click",
        resetForNewRecording
      );


  } finally {

    isSending =
      false;

  }

}


// ============================================================================
// 🔄 18. 새 입력 준비
// ============================================================================

function resetForNewRecording() {

  clearTimeout(
    recordingTimer
  );


  /*
   * 🆕 모바일 자동 재시작 예약도 함께 정리합니다.
   *
   * "처음으로 돌아가기"를 누른 뒤
   * 이전 음성인식의 onend가 늦게 실행되어
   * 다시 마이크가 켜지는 것을 방지합니다.
   */
  clearTimeout(
    recognitionRestartTimer
  );

  recognitionRestartTimer =
    null;


  if (recognition) {

    try {

      recognition.stop();

    } catch (error) {

      console.log(
        error
      );

    }

  }


  isRecording =
    false;

  finishRequested =
    true;

  recognitionRunning =
    false;

  finalTranscript =
    "";

  interimTranscript =
    "";

  displayedTranscript =
    "";

  pendingToken =
    null;

  isSending =
    false;

  currentInputMode =
    "voice";

  selectedTransactionMode =
    "출고";

  setTransactionMode("출고");

  currentPreviewData =
    null;


  startButton.disabled =
    false;

  setStartButtonLabel(
    "말하기 시작"
  );

  finishButton.disabled =
    true;

  directButton.disabled =
    false;

  timer.textContent =
    "";


  inputResult.innerHTML =
    "버튼을 누르고 말씀해주세요.";


  showInputScreen();

}


// ============================================================================
// 🛡️ 19. HTML 안전 처리
// ============================================================================

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}


// ============================================================================
// 🚀 20-1. 앱 시작 준비
// ⭐ 앱이 열리자마자 거래처 / 제품 / 선택 목록을 먼저 준비합니다.
// ============================================================================

async function initializeApp() {

  // ⭐⭐⭐ [속도 개선 3] 휴대폰에 저장해 둔 데이터가 있으면
//        서버에게 물어보기 전에 먼저 보여줍니다(즉시 시작).
  const cachedInitial =
    readInitialDataCache(INITIAL_DATA_CACHE_KEY);

  if (cachedInitial) {

    try {

      applyInitialData(cachedInitial);

      initialDataReady = true;

      inputResult.innerHTML =
        "버튼을 누르고 말씀해주세요. ⚡";

      console.log(
        "⚡ 저장해 둔 데이터로 먼저 시작합니다"
      );

    } catch (cacheApplyError) {

      initialDataReady = false;

    }

  }

  initialDataLoading = true;
  initialDataReady = cachedInitial ? true : false;


  // ⭐ 첫 화면에서 준비 중이라는 것을 바로 보여줍니다.
inputResult.innerHTML =
  '<div class="notion-loading">' +
    '<div class="loading-spinner"></div>' +
    '<div class="loading-text">노션 데이터 정보를 불러오고 있습니다...</div>' +
  '</div>';


  // ⭐ 초기 데이터가 준비될 때까지 주요 입력 버튼을 잠시 막습니다.
//  startButton.disabled = true;
//  directButton.disabled = true;
//  inboundModeButton.disabled = true;
//  outboundModeButton.disabled = true;


  try {

    await loadInitialData();


    if (!initialDataReady) {

      if (cachedInitial) {

        // ⭐⭐⭐ 새 데이터를 못 받았어도
//        저장해 둔 데이터가 있으면 그대로 사용합니다.
        initialDataReady = true;

        inputResult.innerHTML =
          "버튼을 누르고 말씀해주세요. ⚡";

        console.warn(
          "새 데이터를 못 받았지만 저장해 둔 데이터로 계속합니다."
        );

      } else {

        throw new Error(
          "초기 데이터 준비에 실패했습니다."
        );

      }

    }
    // ⭐ 노션 데이터 로딩 완료
inputResult.innerHTML =
  "버튼을 누르고 말씀해주세요.";


    // ⭐ 모든 초기 데이터가 준비된 후에만 사용 가능
//    startButton.disabled = false;
//    directButton.disabled = false;
//    inboundModeButton.disabled = false;
//    outboundModeButton.disabled = false;


    inputResult.innerHTML =
      "버튼을 누르고 말씀해주세요.";


    console.log(
      "🚀 앱 사용 준비 완료"
    );


  } catch (error) {

    console.error(
      "앱 시작 준비 오류:",
      error
    );


    startButton.disabled = true;
    directButton.disabled = true;
    inboundModeButton.disabled = true;
    outboundModeButton.disabled = true;


    inputResult.innerHTML =
      '<div class="error">' +
        '❌ 거래처 / 제품 정보를 준비하지 못했습니다.<br><br>' +
        escapeHtml(
          error.message ||
          String(error)
        ) +
      '</div>';

  }

}
  
// ============================================================================
// ⭐ 20. 페이지 처음 열렸을 때
// ============================================================================

initializeApp();
